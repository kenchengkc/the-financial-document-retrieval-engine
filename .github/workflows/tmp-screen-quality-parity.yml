name: Temporary screen quality parity

on:
  push:
    branches:
      - phase0-screen-latency-profile

permissions:
  contents: write

jobs:
  verify:
    if: ${{ contains(github.event.head_commit.message, '[run-screen-quality-parity]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'local_hash' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'local-hash-v1' }}
      EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '' }}
      SPARSE_PROVIDER: ${{ vars.SPARSE_PROVIDER || 'postgres' }}
      RERANKER_PROVIDER: ${{ vars.RERANKER_PROVIDER || 'none' }}
      RERANKER_MODEL: ${{ vars.RERANKER_MODEL || 'rerank-2.5' }}
      RERANK_TOP_N: ${{ vars.RERANK_TOP_N || '50' }}
      MIN_RERANK_SCORE: ${{ vars.MIN_RERANK_SCORE || '0' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      FDRE_ALLOW_PROD: '1'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase0-screen-latency-profile
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Select production database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi
      - name: Run frozen development benchmark
        run: |
          python scripts/evaluate_cross_sectional.py \
            data/evals/cross_sectional_benchmark.v2.development.jsonl \
            --split development \
            --ks 1 3 5 \
            --output-dir data/processed/evals/screen-quality-parity
      - name: Upload parity report
        uses: actions/upload-artifact@v4
        with:
          name: screen-quality-parity-${{ github.sha }}
          path: data/processed/evals/screen-quality-parity/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/tmp-screen-quality-parity.yml
          git add .github/workflows/tmp-screen-quality-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary screen parity workflow'
          git push origin HEAD:phase0-screen-latency-profile
