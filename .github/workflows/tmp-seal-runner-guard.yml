name: Temporary sealed holdout runner guard

on:
  push:
    branches:
      - phase0-part7-4-sealed-v2-holdout

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'guard sealed holdout execution') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase0-part7-4-sealed-v2-holdout
      - name: Add explicit sealed-holdout opt-in
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/evaluate_cross_sectional.py')
          text = script.read_text()
          text = text.replace('import hashlib\nimport subprocess', 'import hashlib\nimport json\nimport subprocess')
          text = text.replace(
              '    parser.add_argument(\n        "--ks",\n        nargs="+",\n        type=int,\n        default=[1, 3, 5],\n        help="Issuer-ranking cutoffs; defaults to 1 3 5 for five-issuer cases",\n    )\n    return parser.parse_args(argv)\n',
              '    parser.add_argument(\n        "--ks",\n        nargs="+",\n        type=int,\n        default=[1, 3, 5],\n        help="Issuer-ranking cutoffs; defaults to 1 3 5 for five-issuer cases",\n    )\n    parser.add_argument(\n        "--allow-sealed-holdout",\n        action="store_true",\n        help="Explicitly authorize the first execution of a sealed holdout benchmark",\n    )\n    return parser.parse_args(argv)\n\n\ndef require_sealed_holdout_optin(dataset: str, *, allow: bool) -> None:\n    dataset_path = Path(dataset)\n    manifest_path = dataset_path.with_name(\n        f"{dataset_path.stem}.manifest.json"\n    )\n    if not manifest_path.exists():\n        return\n    manifest = json.loads(manifest_path.read_text())\n    if (\n        manifest.get("status") == "sealed"\n        and manifest.get("evaluation_status") == "never_run"\n        and not allow\n    ):\n        raise ValueError(\n            "Refusing to execute a sealed holdout benchmark. "\n            "Use --allow-sealed-holdout only for the deliberate first evaluation."\n        )\n'
          )
          text = text.replace(
              '    args = parse_args(argv)\n    require_neon_optin()\n',
              '    args = parse_args(argv)\n    require_sealed_holdout_optin(args.dataset, allow=args.allow_sealed_holdout)\n    require_neon_optin()\n',
          )
          script.write_text(text)

          test = Path('packages/fdre/tests/test_cross_sectional_v2_holdout.py')
          t = test.read_text()
          t = t.replace('from typing import Any\n\n', 'from typing import Any\n\nimport pytest\n')
          t = t.replace(
              'from fdre.research.screen import ResearchScreenPlan\n',
              'from fdre.research.screen import ResearchScreenPlan\nfrom scripts.evaluate_cross_sectional import require_sealed_holdout_optin\n',
          )
          t += '''\n\ndef test_v2_holdout_requires_explicit_first_run_optin() -> None:\n    with pytest.raises(ValueError, match="sealed holdout"):\n        require_sealed_holdout_optin(str(HOLDOUT), allow=False)\n    require_sealed_holdout_optin(str(HOLDOUT), allow=True)\n'''
          test.write_text(t)
          PY
          rm .github/workflows/tmp-seal-runner-guard.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'eval: guard sealed holdout execution'
          git push origin HEAD:phase0-part7-4-sealed-v2-holdout
