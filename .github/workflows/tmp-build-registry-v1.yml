name: Temporary registry transplant

on:
  push:
    branches: [research-experiment-registry-v1]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research-experiment-registry-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Transplant reviewed registry files
        run: |
          git fetch origin research-experiment-registry-replay
          git show FETCH_HEAD:src/fdre/research/experiment_registry.py > src/fdre/research/experiment_registry.py
          git show FETCH_HEAD:scripts/research_experiment.py > scripts/research_experiment.py
          git show FETCH_HEAD:tests/fdre/test_experiment_registry.py > tests/fdre/test_experiment_registry.py
          git show FETCH_HEAD:src/fdre/research/__init__.py > src/fdre/research/__init__.py
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fdre/research/experiment_registry.py')
          text = path.read_text()
          text = text.replace(
              '_REGISTRY_VERSION = "research-experiment-registry-v1"\n',
              '_REGISTRY_VERSION = "research-experiment-registry-v1"\n'
              '_EXPECTED_EXPERIMENT_TYPES: dict[ArtifactKind, str] = {\n'
              '    "walk_forward": "walk_forward_signal_study",\n'
              '    "oos_diagnostics": "oos_signal_diagnostics",\n'
              '    "oos_selection": "oos_signal_selection",\n'
              '    "oos_implementation": "oos_signal_implementation",\n'
              '    "oos_promotion": "oos_signal_promotion",\n'
              '}\n'
          )
          text = text.replace(
              '    else:\n        experiment.config_json = config_json\n        experiment.results_json = payload\n    session.commit()\n',
              '    else:\n'
              '        if experiment.results_json != payload:\n'
              '            raise ValueError("registered research experiment payload mismatch")\n'
              '        return experiment\n'
              '    session.commit()\n'
          )
          text = text.replace(
              '        row = _get_experiment(session, artifact.experiment_key)\n        actual = _json_digest(row.results_json)\n',
              '        row = _get_experiment(session, artifact.experiment_key)\n'
              '        expected_type = _EXPECTED_EXPERIMENT_TYPES[artifact.kind]\n'
              '        if row.experiment_type != expected_type:\n'
              '            raise ValueError(\n'
              '                f"artifact type mismatch for {artifact.kind}:{artifact.experiment_key}"\n'
              '            )\n'
              '        actual = _json_digest(row.results_json)\n'
          )
          text = text.replace(
              '    promotion_ref = next(\n        item for item in manifest.artifacts if item.kind == "oos_promotion"\n    )\n',
              '    promotion_ref = next(\n'
              '        (item for item in manifest.artifacts if item.kind == "oos_promotion"),\n'
              '        None,\n'
              '    )\n'
              '    if promotion_ref is None:\n'
              '        raise ValueError("registered experiment has no OOS promotion artifact")\n'
          )
          old = '''def _filing_lineage(source: WalkForwardStudyReport) -> list[FilingLineageRef]:
    unique: dict[tuple[str, str], FilingLineageRef] = {}
    for item in source.oos_observations:
        key = (item.accession_number, item.window)
        unique[key] = FilingLineageRef(
            ticker=item.ticker.upper(),
            accession_number=item.accession_number,
            available_at=item.available_at.isoformat(),
            max_source_available_at=item.max_source_available_at.isoformat(),
            feature_lineage_id=item.feature_lineage_id,
        )
    return sorted(
        unique.values(),
        key=lambda item: (item.accession_number, item.available_at),
    )
'''
          new = '''def _filing_lineage(source: WalkForwardStudyReport) -> list[FilingLineageRef]:
    unique: dict[str, FilingLineageRef] = {}
    for item in source.oos_observations:
        lineage = FilingLineageRef(
            ticker=item.ticker.upper(),
            accession_number=item.accession_number,
            available_at=item.available_at.isoformat(),
            max_source_available_at=item.max_source_available_at.isoformat(),
            feature_lineage_id=item.feature_lineage_id,
        )
        existing = unique.get(item.accession_number)
        if existing is not None and existing != lineage:
            raise ValueError(
                f"conflicting filing lineage for accession {item.accession_number}"
            )
        unique[item.accession_number] = lineage
    return sorted(
        unique.values(),
        key=lambda item: (item.accession_number, item.available_at),
    )
'''
          if old not in text:
              raise SystemExit('lineage block not found')
          text = text.replace(old, new)
          path.write_text(text)

          tests = Path('tests/fdre/test_experiment_registry.py')
          content = tests.read_text()
          content += '''


def test_manifest_deduplicates_same_filing_across_windows() -> None:
    source, diagnostics, selection, implementation, promotion = _artifacts()
    original = source.oos_observations[0]
    second = original.model_copy(update={"window": "1:63"})
    source = source.model_copy(update={"oos_observations": [original, second]})

    manifest = build_research_experiment_manifest(
        source, diagnostics, selection, implementation, promotion
    )

    assert len(manifest.filing_lineage) == 1
    assert manifest.filing_lineage[0].accession_number == original.accession_number


def test_manifest_rejects_conflicting_lineage_for_same_accession() -> None:
    source, diagnostics, selection, implementation, promotion = _artifacts()
    original = source.oos_observations[0]
    changed = original.model_copy(
        update={"max_source_available_at": datetime(2024, 1, 11, 20, tzinfo=UTC)}
    )
    source = source.model_copy(update={"oos_observations": [original, changed]})

    with pytest.raises(ValueError, match="conflicting filing lineage"):
        build_research_experiment_manifest(
            source, diagnostics, selection, implementation, promotion
        )


def test_registry_rejects_child_with_wrong_artifact_type() -> None:
    source, diagnostics, selection, implementation, promotion = _artifacts()
    manifest = build_research_experiment_manifest(
        source, diagnostics, selection, implementation, promotion
    )
    with _session() as session:
        children = [
            (source.experiment_key, "wrong_type", source),
            (diagnostics.diagnostics_key, "oos_signal_diagnostics", diagnostics),
            (selection.selection_key, "oos_signal_selection", selection),
            (implementation.implementation_key, "oos_signal_implementation", implementation),
            (promotion.promotion_key, "oos_signal_promotion", promotion),
        ]
        for key, kind, report in children:
            _persist_child(session, key, kind, report.model_dump(mode="json"))
        session.commit()
        persist_research_experiment_manifest(session, manifest)

        with pytest.raises(ValueError, match="artifact type mismatch"):
            verify_research_experiment(session, manifest.experiment_id)


def test_registry_manifest_is_immutable_after_registration() -> None:
    source, diagnostics, selection, implementation, promotion = _artifacts()
    manifest = build_research_experiment_manifest(
        source, diagnostics, selection, implementation, promotion
    )
    with _session() as session:
        persist_research_experiment_manifest(session, manifest)
        row = session.query(ResearchExperiment).filter_by(
            experiment_key=manifest.experiment_id
        ).one()
        row.results_json = {**row.results_json, "code_sha": "tampered"}
        session.commit()

        with pytest.raises(ValueError, match="payload mismatch"):
            persist_research_experiment_manifest(session, manifest)
'''
          tests.write_text(content)
          PY
      - name: Validate registry
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/fdre/research/experiment_registry.py scripts/research_experiment.py tests/fdre/test_experiment_registry.py
          mypy src/fdre/research/experiment_registry.py scripts/research_experiment.py
          pytest -q tests/fdre/test_experiment_registry.py
      - name: Commit registry and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fdre/research/experiment_registry.py scripts/research_experiment.py tests/fdre/test_experiment_registry.py src/fdre/research/__init__.py
          git commit -m 'research: add immutable experiment registry and replay'
          git rm .github/workflows/tmp-build-registry-v1.yml
          git commit -m 'chore: remove temporary registry workflow'
          git push origin HEAD:research-experiment-registry-v1
