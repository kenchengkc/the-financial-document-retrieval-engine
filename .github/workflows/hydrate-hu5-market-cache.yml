name: HU-5 market symbology cache preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hydrate-hu5-market-cache.yml"

permissions:
  contents: read

concurrency:
  group: fdre-hu5-market-symbology-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate frozen HU-5 market symbology cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      PYTHONPATH: .

    steps:
      - name: Check required database secret
        run: |
          if { [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; }; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore frozen market cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/market
          key: fdre-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fdre-market-${{ runner.os }}-

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data]"

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Validate frozen symbology and cache without evaluating returns
        run: |
          mkdir -p data/processed/ops/hu5-market-symbology-preflight
          python -m scripts.research.hu5_market_symbology_preflight \
            --output data/processed/ops/hu5-market-symbology-preflight/preflight.json

      - name: Manifest restored market cache
        if: always()
        run: |
          mkdir -p data/processed/ops/hu5-market-symbology-preflight
          python -m scripts.research.market_cache_manifest \
            --cache-dir data/cache/market \
            --manifest data/processed/ops/hu5-market-symbology-preflight/market-cache-manifest.json

      - name: Summarize preflight evidence
        if: success()
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("data/processed/ops/hu5-market-symbology-preflight/preflight.json").read_text()
          )
          print("### HU-5 market symbology cache preflight")
          print()
          print(f"- Status: {payload['status']}")
          print(f"- Historical symbols: {payload['required_historical_symbol_count']} / 271")
          print(f"- Provider symbols: {payload['provider_symbol_count']}")
          print(f"- KFT restricted-window validation: {payload['restricted_alias_window_validation']}")
          print(f"- Symbology manifest: `{payload['market_symbology_manifest_id']}`")
          print(f"- Outcome mapping: `{payload['outcome_mapping_id']}`")
          print(f"- Return evaluation performed: {payload['return_evaluation_performed']}")
          PY

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu5-market-symbology-preflight-${{ github.run_id }}
          path: data/processed/ops/hu5-market-symbology-preflight
          if-no-files-found: warn
          retention-days: 90
