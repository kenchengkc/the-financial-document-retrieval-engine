name: Temporary PR31 build

on:
  push:
    branches: [perf-pit-screen-document-select]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf-pit-screen-document-select
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply PR31 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('src/fdre/research/panel.py')
          text = panel.read_text()
          text = text.replace(
              'from sqlalchemy.orm import Session, joinedload',
              'from sqlalchemy.orm import Session, contains_eager, joinedload',
          )
          old = '''    document_select_started = perf_counter()\n    statement = (\n        select(Document)\n        .options(joinedload(Document.company))\n        .join(Company, Company.id == Document.company_id)\n'''
          new = '''    db_checkout_started = perf_counter()\n    session.connection()\n    _record_timing(timings_ms, "panel_db_checkout", db_checkout_started)\n\n    document_select_started = perf_counter()\n    statement = (\n        select(Document)\n        .options(contains_eager(Document.company))\n        .join(Company, Company.id == Document.company_id)\n'''
          if old not in text:
              raise SystemExit('panel select block not found')
          text = text.replace(old, new, 1)
          panel.write_text(text)

          documents = Path('apps/api/app/models/documents.py')
          text = documents.read_text()
          text = text.replace('    func,\n)', '    func,\n    text,\n)', 1)
          anchor = '''        Index(\n            "ix_documents_company_form_period_available",\n            "company_id",\n            "form_type",\n            "period_end_date",\n            "available_at",\n        ),\n'''
          addition = anchor + '''        Index(\n            "ix_documents_pit_screen_select",\n            "company_id",\n            "form_type",\n            "available_at",\n            "id",\n            postgresql_where=text(\n                "available_at IS NOT NULL AND period_end_date IS NOT NULL "\n                "AND is_amendment IS false"\n            ),\n        ),\n'''
          if anchor not in text:
              raise SystemExit('document index anchor not found')
          text = text.replace(anchor, addition, 1)
          documents.write_text(text)

          profiler = Path('apps/api/app/routes/research_profiled.py')
          text = profiler.read_text()
          needle = '''                f"semantic_search;dur={search_wall_ms}",\n                f"panel_document_select;dur={screen_stages.get('panel_document_select', 0)}",\n'''
          replacement = '''                f"semantic_search;dur={search_wall_ms}",\n                f"panel_db_checkout;dur={screen_stages.get('panel_db_checkout', 0)}",\n                f"panel_document_select;dur={screen_stages.get('panel_document_select', 0)}",\n'''
          if needle not in text:
              raise SystemExit('profiler timing anchor not found')
          profiler.write_text(text.replace(needle, replacement, 1))

          test = Path('tests/fdre/test_research_panel.py')
          text = test.read_text()
          needle = '''        panel = build_research_panel(session, query)\n        repeated_panel = build_research_panel(session, query)\n\n    assert len(statements) == 8\n'''
          replacement = '''        timings_ms: dict[str, int] = {}\n        panel = build_research_panel(session, query, timings_ms=timings_ms)\n        repeated_panel = build_research_panel(session, query)\n\n    assert len(statements) == 8\n    assert "panel_db_checkout" in timings_ms\n    assert statements[0].lower().count(" join companies") == 1\n'''
          if needle not in text:
              raise SystemExit('research panel test anchor not found')
          test.write_text(text.replace(needle, replacement, 1))

          migration = Path('apps/api/alembic/versions/f2a4c6e8b103_add_pit_screen_document_index.py')
          migration.write_text('''"""add PIT screen document index\n\nRevision ID: f2a4c6e8b103\nRevises: e1f3a5c7d902\nCreate Date: 2026-08-27 18:20:00\n"""\n\nfrom collections.abc import Sequence\n\nimport sqlalchemy as sa\nfrom alembic import op\n\nrevision: str = "f2a4c6e8b103"\ndown_revision: str | None = "e1f3a5c7d902"\nbranch_labels: str | Sequence[str] | None = None\ndepends_on: str | Sequence[str] | None = None\n\n\ndef upgrade() -> None:\n    op.create_index(\n        "ix_documents_pit_screen_select",\n        "documents",\n        ["company_id", "form_type", "available_at", "id"],\n        unique=False,\n        postgresql_where=sa.text(\n            "available_at IS NOT NULL AND period_end_date IS NOT NULL "\n            "AND is_amendment IS false"\n        ),\n    )\n\n\ndef downgrade() -> None:\n    op.drop_index("ix_documents_pit_screen_select", table_name="documents")\n''')
          PY
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focused validation
        run: |
          ruff check src/fdre/research/panel.py apps/api/app/models/documents.py apps/api/app/routes/research_profiled.py tests/fdre/test_research_panel.py apps/api/alembic/versions/f2a4c6e8b103_add_pit_screen_document_index.py
          mypy src apps
          pytest -q tests/fdre/test_research_panel.py
          alembic heads
      - name: Commit validated patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr31-build.yml
          git add src/fdre/research/panel.py apps/api/app/models/documents.py apps/api/app/routes/research_profiled.py tests/fdre/test_research_panel.py apps/api/alembic/versions/f2a4c6e8b103_add_pit_screen_document_index.py
          git commit -m "perf: stabilize PIT screen document selection"
          git push origin HEAD:perf-pit-screen-document-select
