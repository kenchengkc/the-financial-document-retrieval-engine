name: Build PR28 exact-accession retrieval

on:
  push:
    branches:
      - perf-exact-accession-screen-retrieval

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf-exact-accession-screen-retrieval
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply exact-accession retrieval boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise RuntimeError(f"expected block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/fdre/retrieval/query.py",
              "    ciks: list[str] = Field(default_factory=list)\n    form_types: list[str] = Field(default_factory=list)\n",
              "    ciks: list[str] = Field(default_factory=list)\n    accession_numbers: list[str] = Field(default_factory=list)\n    form_types: list[str] = Field(default_factory=list)\n",
          )
          replace(
              "src/fdre/retrieval/query.py",
              "    if filters.ciks and metadata.get(\"cik\") not in filters.ciks:\n        return False\n    if filters.form_types and metadata.get(\"form_type\") not in filters.form_types:\n",
              "    if filters.ciks and metadata.get(\"cik\") not in filters.ciks:\n        return False\n    if filters.accession_numbers:\n        accession_number = metadata.get(\"accession_number\")\n        if accession_number is None:\n            document = getattr(chunk, \"document\", None)\n            accession_number = getattr(document, \"accession_number\", None)\n        if accession_number not in filters.accession_numbers:\n            return False\n    if filters.form_types and metadata.get(\"form_type\") not in filters.form_types:\n",
          )

          replace(
              "src/fdre/retrieval/dense.py",
              "        exact_filtered_window = bool(\n            filters.tickers\n            and filters.accepted_at_from is not None\n            and filters.accepted_at_to is not None\n        )\n",
              "        exact_filtered_window = bool(\n            filters.accession_numbers\n            or (\n                filters.tickers\n                and filters.accepted_at_from is not None\n                and filters.accepted_at_to is not None\n            )\n        )\n",
          )
          replace(
              "src/fdre/retrieval/dense.py",
              "    if filters.ciks:\n        statement = statement.where(Company.cik.in_(filters.ciks))\n    if filters.form_types:\n",
              "    if filters.ciks:\n        statement = statement.where(Company.cik.in_(filters.ciks))\n    if filters.accession_numbers:\n        statement = statement.where(\n            Document.accession_number.in_(filters.accession_numbers)\n        )\n    if filters.form_types:\n",
          )

          replace(
              "src/fdre/indexing/sparse_index.py",
              "        if filters.ciks:\n            statement = statement.where(Company.cik.in_(filters.ciks))\n        if filters.form_types:\n",
              "        if filters.ciks:\n            statement = statement.where(Company.cik.in_(filters.ciks))\n        if filters.accession_numbers:\n            statement = statement.where(\n                Document.accession_number.in_(filters.accession_numbers)\n            )\n        if filters.form_types:\n",
          )

          replace(
              "src/fdre/research/screen.py",
              "            tickers=(\n                [row.ticker for row in survivor_rows]\n                if plan.conditions or plan.tickers\n                else []\n            ),\n            form_types=[form.upper() for form in plan.form_types],\n",
              "            tickers=(\n                [row.ticker for row in survivor_rows]\n                if plan.conditions or plan.tickers\n                else []\n            ),\n            accession_numbers=sorted(\n                {row.accession_number for row in survivor_rows}\n            ),\n            form_types=[form.upper() for form in plan.form_types],\n",
          )

          replace(
              "tests/fdre/test_research_screen.py",
              "    assert filters.tickers == [\"AAA\"]\n    assert filters.as_of == datetime(2026, 6, 1, tzinfo=UTC)\n",
              "    assert filters.tickers == [\"AAA\"]\n    assert filters.accession_numbers == [\"aaa-2025-q1\"]\n    assert filters.as_of == datetime(2026, 6, 1, tzinfo=UTC)\n",
          )

          test_path = Path("tests/fdre/test_retrieval.py")
          test_text = test_path.read_text()
          marker = "\n\ndef test_expand_with_neighbors_adds_adjacent_chunks() -> None:\n"
          if marker not in test_text:
              raise RuntimeError("test insertion marker not found")
          accession_test = '''\n\ndef test_retrieval_filters_by_exact_accession() -> None:\n    engine = create_engine("sqlite+pysqlite:///:memory:")\n    Base.metadata.create_all(engine)\n    provider = LocalHashEmbeddingProvider(dimensions=32)\n    with Session(engine) as session:\n        _seed_retrieval_data(session)\n        company = session.scalar(select(Company).where(Company.ticker == "NVDA"))\n        assert company is not None\n        older_document = Document(\n            company=company,\n            source_type="sec",\n            form_type="10-K",\n            accession_number="0001045810-24-000001",\n        )\n        older_element = DocumentElement(\n            document=older_document,\n            element_type="text",\n            section="Business",\n            text="AI data center revenue increased dramatically.",\n            reading_order=1,\n        )\n        older_chunk = Chunk(\n            document=older_document,\n            element=older_element,\n            chunk_text=older_element.text,\n            chunk_type="text",\n            section="Business",\n            token_count=len(older_element.text.split()),\n            metadata_json={\n                "ticker": "NVDA",\n                "cik": "0001045810",\n                "form_type": "10-K",\n                "section": "Business",\n                "element_type": "text",\n            },\n        )\n        session.add(older_document)\n        session.commit()\n        rebuild_embeddings(session, provider)\n\n        filters = SearchFilters(\n            tickers=["NVDA"],\n            accession_numbers=["0001045810-25-000023"],\n            sections=["Business"],\n        )\n        dense_results = DenseRetriever(provider).search(\n            session,\n            "AI data center revenue",\n            filters=filters,\n            limit=10,\n        )\n        sparse_results = SparseRetriever().search(\n            session,\n            "AI data center revenue",\n            filters=filters,\n            limit=10,\n        )\n\n        assert dense_results\n        assert sparse_results\n        assert older_chunk.id not in {result.chunk_id for result in dense_results}\n        assert older_chunk.id not in {result.chunk_id for result in sparse_results}\n        for results in (dense_results, sparse_results):\n            accessions = set(\n                session.scalars(\n                    select(Document.accession_number)\n                    .join(Chunk, Chunk.document_id == Document.id)\n                    .where(\n                        Chunk.id.in_([result.chunk_id for result in results])\n                    )\n                )\n            )\n            assert accessions == {"0001045810-25-000023"}\n'''
          test_path.write_text(test_text.replace(marker, accession_test + marker, 1))
          PY
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"
      - name: Validate focused change
        run: |
          ruff check src/fdre/retrieval/query.py src/fdre/retrieval/dense.py src/fdre/indexing/sparse_index.py src/fdre/research/screen.py tests/fdre/test_retrieval.py tests/fdre/test_research_screen.py
          mypy src/fdre/retrieval/query.py src/fdre/retrieval/dense.py src/fdre/indexing/sparse_index.py src/fdre/research/screen.py
          pytest -q tests/fdre/test_retrieval.py tests/fdre/test_research_screen.py
      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-build-pr28.yml
          git add src/fdre/retrieval/query.py src/fdre/retrieval/dense.py src/fdre/indexing/sparse_index.py src/fdre/research/screen.py tests/fdre/test_retrieval.py tests/fdre/test_research_screen.py
          git commit -m "perf: constrain screen retrieval to selected filings"
          git push origin HEAD:perf-exact-accession-screen-retrieval
