name: Flagship risk-churn acceleration

on:
  workflow_dispatch:
    inputs:
      max_tickers:
        description: "Maximum historically eligible issuer count"
        default: "250"
      min_documents:
        description: "Minimum 10-K/10-Q history per issuer"
        default: "6"
      max_uncached_market_fetches:
        description: "Maximum uncached market-data requests"
        default: "300"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flagship-risk-churn-acceleration.yml"
      - "scripts/research/hu5_risk_churn_acceleration.py"
      - "scripts/research/historical_universe/historical_universe_blocker_audit.py"
      - "scripts/research/historical_universe/historical_universe_blocker_queue.py"
      - "src/fdre/research/hu5_universe.py"
      - "src/fdre/research/hu5_blockers.py"

permissions:
  contents: read

concurrency:
  group: fdre-flagship-risk-churn-acceleration
  cancel-in-progress: false

jobs:
  flagship:
    name: Run sealed OOS flagship study
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      PYTHONPATH: .
      MAX_TICKERS: ${{ github.event.inputs.max_tickers || '250' }}
      MIN_DOCUMENTS: ${{ github.event.inputs.min_documents || '6' }}
      MAX_UNCACHED_MARKET_FETCHES: ${{ github.event.inputs.max_uncached_market_fetches || '300' }}
    steps:
      - name: Validate inputs
        run: |
          [[ "${MAX_TICKERS}" =~ ^[1-9][0-9]*$ ]]
          [[ "${MIN_DOCUMENTS}" =~ ^[1-9][0-9]*$ ]]
          [[ "${MAX_UNCACHED_MARKET_FETCHES}" =~ ^[0-9]+$ ]]

      - name: Check required database secret
        run: |
          if { [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; }; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore market cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/market
          key: fdre-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fdre-market-${{ runner.os }}-

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data]"

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Measure strict historical-universe blockers
        run: |
          mkdir -p data/processed/flagship/risk-churn-acceleration
          python -m scripts.research.historical_universe.historical_universe_blocker_audit \
            --database-url "${DATABASE_URL}" \
            --output data/processed/flagship/risk-churn-acceleration/universe-blockers.json
          python -m scripts.research.historical_universe.historical_universe_blocker_queue \
            --input data/processed/flagship/risk-churn-acceleration/universe-blockers.json \
            --output data/processed/flagship/risk-churn-acceleration/universe-remediation-queue.json
          {
            echo "### HU-5 strict-universe remediation queue"
            echo '```json'
            jq '{blocker_audit_id, membership_blocker_count, top_blockers: .ranked_membership_blockers[:10]}' \
              data/processed/flagship/risk-churn-acceleration/universe-remediation-queue.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run precommitted HU-5 flagship study
        run: |
          args=(
            --max-tickers "${MAX_TICKERS}"
            --min-documents "${MIN_DOCUMENTS}"
            --max-uncached-market-fetches "${MAX_UNCACHED_MARKET_FETCHES}"
            --output-dir data/processed/flagship/risk-churn-acceleration
          )
          log_file="$(mktemp)"
          set +e
          python -m scripts.research.hu5_risk_churn_acceleration "${args[@]}" 2>&1 | tee "${log_file}"
          status=${PIPESTATUS[0]}
          set -e
          primary_result="$(grep '^PRIMARY_RESULT=' "${log_file}" | tail -1 || true)"
          if [ -n "${primary_result}" ]; then
            {
              echo "### Flagship primary result"
              echo
              echo "\`${primary_result}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::notice::${primary_result}"
          fi
          exit "${status}"

      - name: Manifest reproducible market cache
        if: always()
        run: |
          python -m scripts.research.market_cache_manifest \
            --cache-dir data/cache/market \
            --manifest data/processed/flagship/risk-churn-acceleration/market-cache-manifest.json

      - name: Upload flagship research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-risk-churn-acceleration-${{ github.run_id }}
          path: data/processed/flagship/risk-churn-acceleration
          if-no-files-found: warn

      - name: Save market cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache/market
          key: fdre-market-${{ runner.os }}-${{ github.run_id }}
