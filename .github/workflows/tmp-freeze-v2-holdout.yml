name: Temporary freeze v2 holdout

on:
  push:
    branches:
      - phase0-part7-4-sealed-v2-holdout

permissions:
  contents: write

jobs:
  freeze:
    if: ${{ !contains(github.event.head_commit.message, 'freeze sealed cross-sectional v2 holdout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase0-part7-4-sealed-v2-holdout
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Copy reviewed candidate and freeze manifest
        run: |
          set -euo pipefail
          git fetch origin tmp-part7-4-holdout-review:refs/remotes/origin/tmp-part7-4-holdout-review
          git show origin/tmp-part7-4-holdout-review:tmp/cross_sectional_benchmark.v2.holdout.jsonl \
            > data/evals/cross_sectional_benchmark.v2.holdout.jsonl
          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          from fdre.evals.datasets import compute_dataset_sha256, load_cross_sectional_benchmark

          root = Path('.')
          holdout_path = root / 'data/evals/cross_sectional_benchmark.v2.holdout.jsonl'
          dev_path = root / 'data/evals/cross_sectional_benchmark.v2.development.jsonl'

          # Current-value structured cases do not consume prior values. Keep the key
          # explicit for the reviewed-condition schema without inventing a dependency.
          records = [json.loads(line) for line in holdout_path.read_text().splitlines() if line.strip()]
          for record in records:
              metadata = record.get('metadata', {})
              if metadata.get('expected_conditions') and 'selected_prior_accession' not in metadata:
                  metadata['selected_prior_accession'] = None
          holdout_path.write_text(
              '\n'.join(json.dumps(record, sort_keys=True, separators=(',', ':')) for record in records) + '\n'
          )

          holdout = load_cross_sectional_benchmark(holdout_path)
          development = load_cross_sectional_benchmark(dev_path)
          holdout_gold = {ticker for q in holdout for ticker in q.expected_tickers}
          development_gold = {ticker for q in development for ticker in q.expected_tickers}
          overlap = sorted(holdout_gold & development_gold)
          assert not overlap, overlap

          manifest = {
              'benchmark_name': 'FDRE Cross-Sectional v2 Holdout',
              'benchmark_version': 'v2',
              'split': 'holdout',
              'status': 'sealed',
              'evaluation_status': 'never_run',
              'sealed_at': '2026-08-25T22:46:00Z',
              'as_of': '2026-07-31T23:59:59+00:00',
              'question_count': len(holdout),
              'task_type_counts': dict(sorted(Counter(q.resolved_task_type for q in holdout).items())),
              'dataset_path': str(holdout_path),
              'dataset_sha256': compute_dataset_sha256(holdout),
              'file_sha256': hashlib.sha256(holdout_path.read_bytes()).hexdigest(),
              'development_dataset_path': str(dev_path),
              'development_dataset_sha256': compute_dataset_sha256(development),
              'development_gold_ticker_overlap': overlap,
              'construction_method': 'raw_pit_panel_and_selected_filing_review',
              'construction_constraints': {
                  'screen_execution': False,
                  'retrieval_execution': False,
                  'embedding_calls': 0,
                  'reranker_calls': 0,
              },
              'first_evaluation_part': '7.5',
          }
          Path('data/evals/cross_sectional_benchmark.v2.holdout.manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Add holdout drift and seal tests
        run: |
          cat > packages/fdre/tests/test_cross_sectional_v2_holdout.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from collections import Counter
          from pathlib import Path
          from typing import Any

          from fdre.evals.datasets import (
              compute_dataset_sha256,
              load_cross_sectional_benchmark,
              validate_benchmark,
              validate_cross_sectional_condition_grounding,
              validate_cross_sectional_evidence_grounding,
          )
          from fdre.research.screen import ResearchScreenPlan

          REPO_ROOT = Path(__file__).resolve().parents[3]
          EVAL_DIR = REPO_ROOT / "data/evals"
          DEVELOPMENT = EVAL_DIR / "cross_sectional_benchmark.v2.development.jsonl"
          HOLDOUT = EVAL_DIR / "cross_sectional_benchmark.v2.holdout.jsonl"
          MANIFEST = EVAL_DIR / "cross_sectional_benchmark.v2.holdout.manifest.json"
          EXPECTED_TASK_COUNTS = {
              "change_screen": 2,
              "semantic_screen": 5,
              "semantic_structured_screen": 3,
              "structured_screen": 3,
              "temporal_screen": 1,
          }
          FORBIDDEN_EXECUTION_KEYS = {
              "condition_grounding_correct",
              "evaluation_metrics",
              "evidence_recall_at_k",
              "false_positive_tickers",
              "issuer_recall_at_k",
              "latency_ms",
              "missed_tickers",
              "retrieval_results",
              "returned_tickers",
              "screen_response",
              "semantic_score",
          }


          def _sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def _nested_keys(value: Any) -> set[str]:
              if isinstance(value, dict):
                  return set(value) | {key for child in value.values() for key in _nested_keys(child)}
              if isinstance(value, list):
                  return {key for child in value for key in _nested_keys(child)}
              return set()


          def test_v2_holdout_is_sealed_grounded_and_disjoint() -> None:
              holdout = load_cross_sectional_benchmark(HOLDOUT)
              development = load_cross_sectional_benchmark(DEVELOPMENT)

              validate_benchmark(
                  holdout,
                  expected_count=14,
                  expected_splits={"holdout": 14},
                  required_categories={"cross_sectional"},
              )
              validate_cross_sectional_evidence_grounding(holdout)
              validate_cross_sectional_condition_grounding(holdout)
              assert Counter(q.resolved_task_type for q in holdout) == EXPECTED_TASK_COUNTS
              assert [q.question_id for q in holdout] == [f"holdout-xs-{i:03d}" for i in range(1, 15)]

              development_ids = {q.question_id for q in development}
              holdout_ids = {q.question_id for q in holdout}
              assert development_ids.isdisjoint(holdout_ids)
              development_gold = {ticker for q in development for ticker in q.expected_tickers}
              holdout_gold = {ticker for q in holdout for ticker in q.expected_tickers}
              assert development_gold.isdisjoint(holdout_gold)

              for question in holdout:
                  assert question.metadata["review_method"] == "raw_pit_panel_and_selected_filing_review"
                  assert question.metadata["reviewed_by"] == "fdre-assisted-holdout-review-2026-08"
                  assert "source_question_ids" not in question.metadata
                  plan_payload = question.metadata["screen_plan"]
                  plan = ResearchScreenPlan.model_validate({"as_of": question.as_of, **plan_payload})
                  assert len(plan.tickers) == 5
                  assert len(set(plan.tickers)) == 5
                  assert question.expected_tickers[0] in plan.tickers
                  assert not (FORBIDDEN_EXECUTION_KEYS & _nested_keys(question.metadata))


          def test_v2_holdout_manifest_pins_seal_and_content() -> None:
              manifest = json.loads(MANIFEST.read_text())
              holdout = load_cross_sectional_benchmark(HOLDOUT)
              development = load_cross_sectional_benchmark(DEVELOPMENT)

              assert manifest["benchmark_name"] == "FDRE Cross-Sectional v2 Holdout"
              assert manifest["benchmark_version"] == "v2"
              assert manifest["split"] == "holdout"
              assert manifest["status"] == "sealed"
              assert manifest["evaluation_status"] == "never_run"
              assert manifest["first_evaluation_part"] == "7.5"
              assert manifest["question_count"] == 14
              assert manifest["task_type_counts"] == EXPECTED_TASK_COUNTS
              assert manifest["dataset_path"] == str(HOLDOUT.relative_to(REPO_ROOT))
              assert manifest["dataset_sha256"] == compute_dataset_sha256(holdout)
              assert manifest["file_sha256"] == _sha256(HOLDOUT)
              assert manifest["development_dataset_path"] == str(DEVELOPMENT.relative_to(REPO_ROOT))
              assert manifest["development_dataset_sha256"] == compute_dataset_sha256(development)
              assert manifest["development_gold_ticker_overlap"] == []
              assert manifest["construction_constraints"] == {
                  "embedding_calls": 0,
                  "reranker_calls": 0,
                  "retrieval_execution": False,
                  "screen_execution": False,
              }
          PY
      - name: Update evaluation plan
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/eval_plan.md')
          marker = '## Cross-Sectional v2 sealed holdout (Part 7.4)'
          text = path.read_text()
          if marker not in text:
              text += '''\n\n## Cross-Sectional v2 sealed holdout (Part 7.4)\n\nThe v2 holdout is frozen at `data/evals/cross_sectional_benchmark.v2.holdout.jsonl`.\nIt contains 14 newly reviewed holdout questions with no question-ID or gold-issuer overlap\nwith the 28-case development benchmark. The locked task mix is 5 semantic, 1 temporal,\n3 structured, 2 change, and 3 semantic+structured screens.\n\nHoldout construction used only the PIT research panel and direct chunks from the exact\nselected filing. It did **not** execute `execute_research_screen`, `/research/screen`,\n`/search`, hybrid retrieval, embeddings, or reranking. The holdout manifest therefore\nrecords `status: sealed` and `evaluation_status: never_run`. Part 7.5 is the first permitted\nbenchmark execution. Any label/content change after that first run requires a new benchmark\nversion rather than editing v2 in place.\n'''
              path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-freeze-v2-holdout.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'eval: freeze sealed cross-sectional v2 holdout (Part 7.4)'
          git push origin HEAD:phase0-part7-4-sealed-v2-holdout
