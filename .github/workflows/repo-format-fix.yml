name: Repository format fix

on:
  push:
    branches:
      - refactor/repo-architecture-cleanup
    paths:
      - ".github/workflows/repo-format-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: refactor/repo-architecture-cleanup

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply Ruff fixes
        run: |
          python -m pip install "ruff==0.16.5"
          ruff check --fix \
            scripts/maintenance/check_architecture.py \
            scripts/pipelines/retrieval_pipeline.py \
            scripts/research/historical_universe/historical_universe_state_support.py \
            tests/unit/fdre/test_document_processing.py \
            tests/unit/fdre/test_historical_security_seed_plan.py \
            tests/unit/fdre/test_historical_universe_blocker_queue.py || true
          ruff format \
            scripts/maintenance/check_architecture.py \
            scripts/pipelines/retrieval_pipeline.py \
            scripts/research/historical_universe/historical_universe_state_support.py \
            tests/unit/fdre/test_document_processing.py \
            tests/unit/fdre/test_historical_security_seed_plan.py \
            tests/unit/fdre/test_historical_universe_blocker_queue.py
          ruff check \
            scripts/maintenance/check_architecture.py \
            scripts/pipelines/retrieval_pipeline.py \
            scripts/research/historical_universe/historical_universe_state_support.py \
            tests/unit/fdre/test_document_processing.py \
            tests/unit/fdre/test_historical_security_seed_plan.py \
            tests/unit/fdre/test_historical_universe_blocker_queue.py

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize moved module imports"
          git push origin HEAD:refactor/repo-architecture-cleanup
