name: Fold ask CSS

on:
  push:
    branches:
      - cleanup/frontend-css-residue

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fold temporary stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path

          layout = Path("apps/web/app/layout.tsx")
          shim = Path("apps/web/app/ask-ui-fixes.css")
          target = Path("apps/web/app/research-console.css")

          import_line = 'import "./ask-ui-fixes.css";\n'
          layout_text = layout.read_text()
          if import_line not in layout_text:
              raise SystemExit("ask-ui-fixes import was not found")
          layout.write_text(layout_text.replace(import_line, "", 1))

          rule = shim.read_text().strip()
          target_text = target.read_text().rstrip()
          if rule in target_text:
              raise SystemExit("ask-ui-fixes rule is already present in research-console.css")
          target.write_text(f"{target_text}\n\n{rule}\n")
          shim.unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/layout.tsx apps/web/app/research-console.css apps/web/app/ask-ui-fixes.css
          git commit -m "cleanup: fold ask CSS shim into research console"
          git push
