name: Historical Universe strict coverage

on:
  workflow_dispatch:
    inputs:
      apply_supported:
        description: "Commit exact fully-supported membership upgrades to production"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
      - research/hu-strict-coverage-closure
    paths:
      - ".github/workflows/historical-universe-strict-coverage.yml"
      - "scripts/research/historical_universe/historical_universe_strict_coverage.py"
      - "scripts/research/historical_universe/historical_universe_state_support.py"
      - "src/fdre/research/historical_universe_strict_coverage.py"
      - "src/fdre/research/historical_universe_state_support.py"
      - "src/fdre/research/historical_universe_lineage.py"
      - "src/fdre/research/hu5_universe.py"
      - "apps/api/app/models/historical_universe.py"

permissions:
  contents: read

concurrency:
  group: fdre-historical-universe-strict-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit production strict coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
      OUTPUT_DIR: data/processed/historical-universe/strict-coverage
      TICKER_LINEAGES_REF: c31ac3cc56f28cf9a02b4e694eff7ceab596a0ff

    steps:
      - name: Check required database secret
        run: |
          if { [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; }; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Download pinned independent ticker history
        run: |
          mkdir -p data/raw/historical-universe
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 60 \
            "https://raw.githubusercontent.com/fja05680/sp500/${TICKER_LINEAGES_REF}/sp500_ticker_start_end.csv" \
            --output data/raw/historical-universe/sp500_ticker_start_end.csv
          test -s data/raw/historical-universe/sp500_ticker_start_end.csv

      - name: Audit provisional membership blockers
        run: |
          mkdir -p "${OUTPUT_DIR}"
          python -m scripts.research.historical_universe.historical_universe_strict_coverage \
            --database-url "${DATABASE_URL}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --output "${OUTPUT_DIR}/strict-coverage.json"

      - name: Project independent state corroboration
        run: |
          python -m scripts.research.historical_universe.historical_universe_state_support \
            --database-url "${DATABASE_URL}" \
            --ticker-lineages data/raw/historical-universe/sp500_ticker_start_end.csv \
            --ticker-lineages-ref "${TICKER_LINEAGES_REF}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --output "${OUTPUT_DIR}/state-support-projection.json"

      - name: Apply independently corroborated memberships
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_supported }}
        env:
          FDRE_ALLOW_PROD: "1"
        run: |
          PLAN_ID="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("data/processed/historical-universe/strict-coverage/state-support-projection.json").read_text())["plan_id"])')"
          python -m scripts.research.historical_universe.historical_universe_state_support \
            --database-url "${DATABASE_URL}" \
            --ticker-lineages data/raw/historical-universe/sp500_ticker_start_end.csv \
            --ticker-lineages-ref "${TICKER_LINEAGES_REF}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --apply \
            --expected-plan-id "${PLAN_ID}" \
            --output "${OUTPUT_DIR}/state-support-apply.json"
          python -m scripts.research.historical_universe.historical_universe_strict_coverage \
            --database-url "${DATABASE_URL}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --output "${OUTPUT_DIR}/strict-coverage-after-apply.json"

      - name: Summarize strict coverage
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("data/processed/historical-universe/strict-coverage")
          report = json.loads((root / "strict-coverage.json").read_text())
          projection = json.loads((root / "state-support-projection.json").read_text())
          gate = projection["projected_gate"]
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as handle:
              handle.write("### Historical Universe strict coverage\n\n")
              handle.write(f"- Audit ID: `{report['audit_id']}`\n")
              handle.write(f"- Live provisional memberships: **{report['provisional_membership_count']}**\n")
              handle.write(f"- Live blocked days: **{report['blocked_day_count']} / {report['day_count']}**\n")
              handle.write(f"- State-support plan ID: `{projection['plan_id']}`\n")
              handle.write(
                  f"- Fully supported membership updates: **{projection['projected_membership_updates']}**\n"
              )
              handle.write(
                  f"- Fully supported identity updates: **{projection['projected_identity_updates']}**\n"
              )
              handle.write(
                  f"- Projected strict-eligible days: **{gate['strict_eligible_day_count']} / {gate['day_count']}**\n"
              )
              apply_path = root / "state-support-apply.json"
              after_path = root / "strict-coverage-after-apply.json"
              if apply_path.exists() and after_path.exists():
                  applied = json.loads(apply_path.read_text())
                  after = json.loads(after_path.read_text())
                  handle.write(
                      f"- Applied supported memberships: **{applied['applied_membership_updates']}**\n"
                  )
                  handle.write(
                      f"- Remaining provisional memberships: **{after['provisional_membership_count']}**\n"
                  )
                  handle.write(
                      f"- Post-apply strict-eligible days: **{after['strict_eligible_day_count']} / {after['day_count']}**\n"
                  )
              handle.write("\n#### Longest projected strict spans\n\n")
              handle.write("| Start | End | Days |\n")
              handle.write("|---|---|---:|\n")
              for row in gate["eligible_spans"][:10]:
                  handle.write(f"| {row['start']} | {row['end']} | {row['day_count']} |\n")
          PY

      - name: Upload strict coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-universe-strict-coverage-${{ github.run_id }}
          path: data/processed/historical-universe/strict-coverage
          if-no-files-found: error
