name: Historical Universe strict coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/hu-strict-coverage-closure
    paths:
      - ".github/workflows/historical-universe-strict-coverage.yml"
      - "scripts/historical_universe_strict_coverage.py"
      - "src/fdre/research/historical_universe_strict_coverage.py"
      - "apps/api/app/models/historical_universe.py"

permissions:
  contents: read

concurrency:
  group: fdre-historical-universe-strict-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit production strict coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
      OUTPUT_DIR: data/processed/historical-universe/strict-coverage

    steps:
      - name: Check required database secret
        run: |
          if { [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; }; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Audit provisional membership blockers
        run: |
          mkdir -p "${OUTPUT_DIR}"
          python -m scripts.historical_universe_strict_coverage \
            --database-url "${DATABASE_URL}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --output "${OUTPUT_DIR}/strict-coverage.json"

      - name: Summarize strict coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/processed/historical-universe/strict-coverage/strict-coverage.json")
          report = json.loads(path.read_text())
          top = report["greedy_cover"][:10]
          with Path("${GITHUB_STEP_SUMMARY}").open("a", encoding="utf-8") as handle:
              handle.write("### Historical Universe strict coverage\n\n")
              handle.write(f"- Audit ID: `{report['audit_id']}`\n")
              handle.write(f"- Provisional memberships: **{report['provisional_membership_count']}**\n")
              handle.write(f"- Blocked days: **{report['blocked_day_count']} / {report['day_count']}**\n")
              handle.write(
                  f"- Membership-provisional-free days: **{report['strict_eligible_day_count']}**\n\n"
              )
              handle.write("#### Highest-leverage blockers\n\n")
              handle.write("| Rank | Membership ID | Newly covered days | Remaining blocked days |\n")
              handle.write("|---:|---:|---:|---:|\n")
              for row in top:
                  handle.write(
                      f"| {row['rank']} | {row['membership_id']} | "
                      f"{row['newly_covered_days']} | {row['remaining_blocked_days']} |\n"
                  )
          PY

      - name: Upload strict coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-universe-strict-coverage-${{ github.run_id }}
          path: data/processed/historical-universe/strict-coverage
          if-no-files-found: error
