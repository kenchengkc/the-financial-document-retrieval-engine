name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/workflow-prune

permissions:
  actions: write
  contents: read

jobs:
  prune-stale-workflows:
    name: Prune stale workflow histories
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/workflow-prune'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete stale workflow run histories
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r run_id workflow_name workflow_path; do
            stale=false
            case "${workflow_name}" in
              "One-shot HU membership apply"|\
              "Historical Universe SGPPRB projection"|\
              "Historical Universe SGPPRB rejection apply"|\
              "HU-5 blocker topology"|\
              "HU-5 membership continuity apply"|\
              "HU-5 membership continuity projection"|\
              "One-shot HU identity metadata audit"|\
              "One-shot HU SEC filing identity projection"|\
              "Repository architecture rewrite"|\
              "Repository format fix"|\
              "Repository test path fix"|\
              "HU-5 continuity replay 2")
                stale=true
                ;;
            esac
            case "${workflow_path}" in
              ".github/workflows/hu-membership-apply-once.yml"|\
              ".github/workflows/hu-sgpprb-apply.yml"|\
              ".github/workflows/hu5-blocker-topology.yml"|\
              ".github/workflows/hu5-membership-continuity-apply.yml"|\
              ".github/workflows/hu-sec-filing-identity-projection-once.yml"|\
              ".github/workflows/hu5-continuity-replay-2.yml")
                stale=true
                ;;
            esac
            if [ "${stale}" = true ]; then
              echo "Deleting stale run ${run_id}: ${workflow_name} (${workflow_path})"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            fi
          done < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .path] | @tsv'
          )

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-trixie
        env:
          POSTGRES_DB: fdre_test
          POSTGRES_PASSWORD: fdre
          POSTGRES_USER: fdre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fdre -d fdre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FDRE_POSTGRES_TEST_URL: postgresql+psycopg://fdre:fdre@localhost:5432/fdre_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Validate repository architecture
        run: python -m scripts.maintenance.check_architecture

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest

      - name: Validate Alembic migrations
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/fdre-ci.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Validate PostgreSQL retrieval indexes
        run: pytest -q apps/api/tests/test_migrations.py -k postgres_retrieval_indexes

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
