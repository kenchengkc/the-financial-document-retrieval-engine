name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-trixie
        env:
          POSTGRES_DB: fdre_test
          POSTGRES_PASSWORD: fdre
          POSTGRES_USER: fdre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fdre -d fdre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FDRE_POSTGRES_TEST_URL: postgresql+psycopg://fdre:fdre@localhost:5432/fdre_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest

      - name: Validate Alembic migrations
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/fdre-ci.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Validate PostgreSQL retrieval indexes
        run: pytest -q apps/api/tests/test_migrations.py -k postgres_retrieval_indexes

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  prune-obsolete-workflow-runs:
    name: Prune obsolete workflow history
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'chore: prune obsolete Actions workflows')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete runs for workflows no longer in the live allowlist
        shell: bash
        run: |
          set -euo pipefail

          keep_paths='[
            ".github/workflows/ci.yml",
            ".github/workflows/company-facts.yml",
            ".github/workflows/flagship-risk-churn-acceleration.yml",
            ".github/workflows/historical-universe-coverage.yml",
            ".github/workflows/ingest.yml",
            ".github/workflows/signal-study.yml",
            ".github/workflows/sp500-ingest.yml"
          ]'

          workflows_json="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            | jq -s '{workflows: map(.workflows) | add}')"

          mapfile -t stale_rows < <(
            jq -r --argjson keep "${keep_paths}" '
              .workflows[]
              | select((.path as $path | $keep | index($path)) == null)
              | [.id, .name, .path, .state] | @tsv
            ' <<< "${workflows_json}"
          )

          echo "Found ${#stale_rows[@]} obsolete workflow registrations."
          total_deleted=0
          {
            echo "### Obsolete Actions workflow purge"
            echo
            echo "| Workflow | Path | State | Runs deleted |"
            echo "| --- | --- | --- | ---: |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for row in "${stale_rows[@]}"; do
            IFS=$'\t' read -r workflow_id workflow_name workflow_path workflow_state <<< "${row}"
            mapfile -t run_ids < <(
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
                --jq '.workflow_runs[] | select(.status == "completed") | .id'
            )

            deleted=0
            for run_id in "${run_ids[@]}"; do
              gh api --method DELETE \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              deleted=$((deleted + 1))
            done
            total_deleted=$((total_deleted + deleted))
            printf '| %s | `%s` | `%s` | %d |\n' \
              "${workflow_name}" "${workflow_path}" "${workflow_state}" "${deleted}" \
              >> "${GITHUB_STEP_SUMMARY}"
          done

          echo "Deleted ${total_deleted} completed runs from obsolete workflow registrations."
          echo "TOTAL_OBSOLETE_WORKFLOW_RUNS_DELETED=${total_deleted}" >> "${GITHUB_ENV}"
