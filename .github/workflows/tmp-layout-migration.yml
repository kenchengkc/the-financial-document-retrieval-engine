name: Temporary repository layout migration

on:
  push:
    branches:
      - repo-layout-src-fdre

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'apply src layout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repo-layout-src-fdre
          fetch-depth: 0
      - name: Apply src layout
        run: |
          set -euo pipefail
          mkdir -p src tests
          git mv packages/fdre/fdre src/fdre
          git mv packages/fdre/tests tests/fdre
          rmdir packages/fdre
          rmdir packages

          python - <<'PY'
          from pathlib import Path

          replacements = {
              'packages/fdre/fdre': 'src/fdre',
              'packages/fdre/tests': 'tests/fdre',
              'packages/fdre:.': 'src:.',
              'packages/fdre': 'src',
          }
          targets = [
              Path('AGENTS.md'),
              Path('pyproject.toml'),
              Path('docs/roadmap.md'),
              Path('docs/eval_results.md'),
          ]
          targets.extend(Path('scripts').glob('*.py'))
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          dockerfile = Path('Dockerfile')
          dockerfile.write_text(
              dockerfile.read_text().replace('COPY packages ./packages', 'COPY src ./src')
          )

          Path('docs/repository_layout.md').write_text('''# Repository layout\n\nFDRE uses an application + Python `src` layout.\n\n```text\napps/\n  api/        FastAPI, SQLAlchemy persistence, provider/config adapters\n  web/        Next.js user interface\nsrc/fdre/     Shared Python engine: ingestion, parsing, retrieval, research, evals\ntests/fdre/   Tests for the shared Python engine\nscripts/      Operator, ingestion, benchmark, and research entrypoints\ndata/         Version-controlled benchmark and seed artifacts\ndocs/         Architecture, methodology, benchmark, and research documentation\n```\n\n`src/fdre` is the shared engine used by the API, scripts, CI, and research workflows.\nIt is not currently persistence-independent: several modules use the API SQLAlchemy models and\nsettings directly. That dependency is intentional and explicit until a measured need justifies\nextracting a separate storage adapter layer. Do not create additional packages merely to make the\nrepository look more modular.\n\nThe bounded LangGraph answer workflow remains in `src/fdre/graph` because the production answer\nservice actively executes it.\n''')
          PY

          rm .github/workflows/tmp-layout-migration.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: apply src layout for fdre package'
          git push origin HEAD:repo-layout-src-fdre
