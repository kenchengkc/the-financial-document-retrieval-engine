name: Historical Universe coverage audit

on:
  workflow_dispatch:
    inputs:
      apply_security_bootstrap:
        description: Apply HU2-R0 current security-master bootstrap before the audit
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-universe-coverage.yml"
      - "scripts/bootstrap_current_security_master.py"
      - "scripts/historical_security_seed_plan.py"
      - "scripts/historical_universe_alias_audit.py"
      - "scripts/historical_universe_anchor_audit.py"
      - "scripts/historical_universe_coverage.py"
      - "src/fdre/research/historical_universe_anchor.py"
      - "src/fdre/research/historical_universe_sources.py"
      - "src/fdre/research/historical_universe_pipeline.py"
      - "src/fdre/research/historical_universe_identity.py"
      - "src/fdre/research/historical_universe_evidence.py"
      - "src/fdre/research/historical_universe_materialization.py"
      - "data/sample/sp500_tickers.json"

permissions:
  contents: read

concurrency:
  group: fdre-historical-universe-coverage
  cancel-in-progress: false

jobs:
  audit:
    name: Run HU-2 coverage audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      OUTPUT_DIR: data/processed/historical-universe/coverage
      SOURCE_DIR: data/cache/historical-universe-sources
      PYTHONPATH: .
      HISTORICAL_ANCHOR_REF: c31ac3cc56f28cf9a02b4e694eff7ceab596a0ff

    steps:
      - name: Check required database secret
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data]"

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Plan current security-master bootstrap
        run: |
          python -m scripts.bootstrap_current_security_master \
            --database-url "${DATABASE_URL}" \
            --current-constituents "data/sample/sp500_tickers.json" \
            --output "${OUTPUT_DIR}/security-master-bootstrap-plan.json"

      - name: Apply current security-master bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_security_bootstrap }}
        run: |
          python -m scripts.bootstrap_current_security_master \
            --database-url "${DATABASE_URL}" \
            --current-constituents "data/sample/sp500_tickers.json" \
            --apply \
            --output "${OUTPUT_DIR}/security-master-bootstrap-applied.json"

      - name: Resolve immutable source revisions
        run: |
          SNP_HISTORY_REF="$(gh api repos/shawnlinxl/snp-history/commits/master --jq .sha)"
          WIKIPEDIA_REVISION="$(curl --fail --location --retry 3 \
            -H "User-Agent: FDRE historical-universe audit kencheng.kc8@gmail.com" \
            'https://en.wikipedia.org/w/api.php?action=query&prop=revisions&titles=Historical_components_of_the_S%26P_500&rvprop=ids&format=json' \
            | python -c 'import json,sys; d=json.load(sys.stdin); print(next(iter(d["query"]["pages"].values()))["revisions"][0]["revid"])')"
          [[ "${SNP_HISTORY_REF}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WIKIPEDIA_REVISION}" =~ ^[0-9]+$ ]]
          [[ "${HISTORICAL_ANCHOR_REF}" =~ ^[0-9a-f]{40}$ ]]
          echo "SNP_HISTORY_REF=${SNP_HISTORY_REF}" >> "${GITHUB_ENV}"
          echo "WIKIPEDIA_REVISION=${WIKIPEDIA_REVISION}" >> "${GITHUB_ENV}"

      - name: Fetch pinned source copies
        run: |
          mkdir -p "${SOURCE_DIR}"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/shawnlinxl/snp-history/${SNP_HISTORY_REF}/data/history.csv" \
            --output "${SOURCE_DIR}/snp-history.csv"
          curl --fail --location --retry 3 \
            -H "User-Agent: FDRE historical-universe audit kencheng.kc8@gmail.com" \
            "https://en.wikipedia.org/w/index.php?title=Historical_components_of_the_S%26P_500&oldid=${WIKIPEDIA_REVISION}" \
            --output "${SOURCE_DIR}/wikipedia-historical-components.html"
          curl --fail --location --retry 3 \
            -H "User-Agent: FDRE historical-universe audit kencheng.kc8@gmail.com" \
            "https://www.sec.gov/Archives/edgar/cik-lookup-data.txt" \
            --output "${SOURCE_DIR}/sec-cik-lookup-data.txt"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/fja05680/sp500/${HISTORICAL_ANCHOR_REF}/S%26P%20500%20Historical%20Components%20%26%20Changes.csv" \
            --output "${SOURCE_DIR}/sp500-complete-history.csv"

      - name: Set audit observation time
        run: echo "HU2_OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Run coverage audit
        run: |
          python -m scripts.historical_universe_coverage \
            --database-url "${DATABASE_URL}" \
            --snp-history "${SOURCE_DIR}/snp-history.csv" \
            --wikipedia-html "${SOURCE_DIR}/wikipedia-historical-components.html" \
            --sec-cik-lookup "${SOURCE_DIR}/sec-cik-lookup-data.txt" \
            --current-constituents "data/sample/sp500_tickers.json" \
            --observed-at "${HU2_OBSERVED_AT}" \
            --snp-history-ref "${SNP_HISTORY_REF}" \
            --wikipedia-revision "${WIKIPEDIA_REVISION}" \
            --output-dir "${OUTPUT_DIR}"

      - name: Emit cross-source issuer aliases
        run: |
          python -m scripts.historical_universe_alias_audit \
            --snp-history "${SOURCE_DIR}/snp-history.csv" \
            --wikipedia-html "${SOURCE_DIR}/wikipedia-historical-components.html" \
            --sec-cik-lookup "${SOURCE_DIR}/sec-cik-lookup-data.txt" \
            --observed-at "${HU2_OBSERVED_AT}" \
            --snp-history-ref "${SNP_HISTORY_REF}" \
            --wikipedia-revision "${WIKIPEDIA_REVISION}" \
            --output "${OUTPUT_DIR}/issuer-aliases.json"

      - name: Emit complete target-window anchor
        run: |
          ANCHOR_URL="https://raw.githubusercontent.com/fja05680/sp500/${HISTORICAL_ANCHOR_REF}/S%26P%20500%20Historical%20Components%20%26%20Changes.csv"
          python -m scripts.historical_universe_anchor_audit \
            --input "${SOURCE_DIR}/sp500-complete-history.csv" \
            --source-ref "${HISTORICAL_ANCHOR_REF}" \
            --source-url "${ANCHOR_URL}" \
            --observed-at "${HU2_OBSERVED_AT}" \
            --output "${OUTPUT_DIR}/complete-snapshot-anchor.json"

      - name: Plan historical security seeds
        run: |
          python -m scripts.historical_security_seed_plan \
            --database-url "${DATABASE_URL}" \
            --snp-history "${SOURCE_DIR}/snp-history.csv" \
            --wikipedia-html "${SOURCE_DIR}/wikipedia-historical-components.html" \
            --sec-cik-lookup "${SOURCE_DIR}/sec-cik-lookup-data.txt" \
            --observed-at "${HU2_OBSERVED_AT}" \
            --snp-history-ref "${SNP_HISTORY_REF}" \
            --wikipedia-revision "${WIKIPEDIA_REVISION}" \
            --output "${OUTPUT_DIR}/historical-security-seed-plan.json"

      - name: Publish summary
        if: always()
        run: |
          if [ -f "${OUTPUT_DIR}/security-master-bootstrap-plan.json" ]; then
            {
              echo "### Current security-master bootstrap plan"
              echo
              echo '```json'
              cat "${OUTPUT_DIR}/security-master-bootstrap-plan.json"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -f "${OUTPUT_DIR}/security-master-bootstrap-applied.json" ]; then
            {
              echo "### Current security-master bootstrap applied"
              echo
              echo '```json'
              cat "${OUTPUT_DIR}/security-master-bootstrap-applied.json"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -f "${OUTPUT_DIR}/issuer-aliases.json" ]; then
            {
              echo "### HU2-R1 cross-source issuer aliases"
              echo
              python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/processed/historical-universe/coverage/issuer-aliases.json").read_text())
          summary = {key: payload[key] for key in (
              "schema_version",
              "membership_evidence_count",
              "sec_name_evidence_count",
              "derived_alias_evidence_count",
              "derived_alias_name_count",
              "repeated_alias_name_count",
              "derivation_rule",
          )}
          print("```json")
          print(json.dumps(summary, indent=2, sort_keys=True))
          print("```")
          PY
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -f "${OUTPUT_DIR}/complete-snapshot-anchor.json" ]; then
            {
              echo "### HU2 complete target-window anchor"
              echo
              python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/processed/historical-universe/coverage/complete-snapshot-anchor.json").read_text())
          summary = {key: payload[key] for key in (
              "anchor_id", "effective_at", "constituent_count", "source", "source_ref",
              "source_hash", "duplicate_display_symbols", "complete_target_window_anchor",
          )}
          print("```json")
          print(json.dumps(summary, indent=2, sort_keys=True))
          print("```")
          PY
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -f "${OUTPUT_DIR}/historical-security-seed-plan.json" ]; then
            {
              echo "### HU2 historical security seed plan"
              echo
              python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/processed/historical-universe/coverage/historical-security-seed-plan.json").read_text())
          keys = (
              "target_missing_security_resolved_issuer_evidence_count",
              "target_missing_security_resolved_issuer_cik_count",
              "candidate_cik_count",
              "candidate_target_evidence_count",
              "candidate_missing_company_count",
              "candidate_existing_company_without_security_count",
              "exclusion_cik_counts",
          )
          print("```json")
          print(json.dumps({key: payload[key] for key in keys}, indent=2, sort_keys=True))
          print("```")
          PY
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -f "${OUTPUT_DIR}/coverage.json" ]; then
            {
              echo "### Historical Universe coverage audit"
              echo
              echo '```json'
              cat "${OUTPUT_DIR}/coverage.json"
              echo '```'
              echo
              echo '### Remediation gate'
              echo
              echo '```json'
              cat "${OUTPUT_DIR}/remediation.json"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-universe-coverage-${{ github.run_id }}
          path: data/processed/historical-universe/coverage
          if-no-files-found: warn
