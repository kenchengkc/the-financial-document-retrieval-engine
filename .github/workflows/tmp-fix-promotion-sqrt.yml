name: Temporary promotion sqrt fix

on:
  push:
    branches: [research-oos-final-promotion]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research-oos-final-promotion
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fix numeric typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/fdre/research/oos_promotion.py')
          text = path.read_text()
          text = text.replace('from pathlib import Path\nfrom statistics import mean\n', 'from math import sqrt\nfrom pathlib import Path\nfrom statistics import mean\n')
          text = text.replace('left_scale = sum((value - left_mean) ** 2 for value in left_ranks) ** 0.5', 'left_scale = sqrt(sum((value - left_mean) ** 2 for value in left_ranks))')
          text = text.replace('right_scale = sum((value - right_mean) ** 2 for value in right_ranks) ** 0.5', 'right_scale = sqrt(sum((value - right_mean) ** 2 for value in right_ranks))')
          path.write_text(text)
          PY
          python -m pip install -e '.[dev]'
          ruff check src/fdre/research/oos_promotion.py
          mypy src/fdre/research/oos_promotion.py
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fdre/research/oos_promotion.py
          git commit -m 'fix: make promotion Spearman typing explicit'
          git rm .github/workflows/tmp-fix-promotion-sqrt.yml
          git commit -m 'chore: remove temporary promotion fix workflow'
          git push origin HEAD:research-oos-final-promotion
