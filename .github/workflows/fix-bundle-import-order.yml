name: Repair bundle test import order

on:
  push:
    branches:
      - feature/portable-experiment-bundle

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sort local research imports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/fdre/test_experiment_registry.py")
          text = path.read_text()
          registry = '''from fdre.research.experiment_registry import (
    ResearchExperimentBundle,
    build_research_experiment_bundle,
    build_research_experiment_manifest,
    persist_research_experiment_manifest,
    read_research_experiment_bundle,
    replay_research_experiment,
    verify_research_experiment,
    verify_research_experiment_bundle,
    write_research_experiment_bundle,
)
from fdre.research.event_study import EventStudyConfig
'''
          ordered = '''from fdre.research.event_study import EventStudyConfig
from fdre.research.experiment_registry import (
    ResearchExperimentBundle,
    build_research_experiment_bundle,
    build_research_experiment_manifest,
    persist_research_experiment_manifest,
    read_research_experiment_bundle,
    replay_research_experiment,
    verify_research_experiment,
    verify_research_experiment_bundle,
    write_research_experiment_bundle,
)
'''
          if registry not in text:
              raise SystemExit("import marker not found")
          path.write_text(text.replace(registry, ordered, 1))
          PY
      - name: Commit import order
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/fdre/test_experiment_registry.py
          git commit -m "test: sort bundle fixture imports"
          git push
