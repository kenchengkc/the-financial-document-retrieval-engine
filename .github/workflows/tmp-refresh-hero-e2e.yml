name: Temporary hero E2E refresh

on:
  push:
    branches: [fix-sec-form-ticker-detection]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-sec-form-ticker-detection
      - name: Update hero assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/e2e/query-results.spec.ts')
          text = path.read_text()
          old = 'page.getByRole("heading", { name: "SEC filing research, with sources included." })'
          new = 'page.getByRole("heading", { name: "Research SEC filings without look-ahead bias." })'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-refresh-hero-e2e.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/e2e/query-results.spec.ts .github/workflows/tmp-refresh-hero-e2e.yml
          git commit -m "test: cover research-oriented landing hero"
          git push origin HEAD:fix-sec-form-ticker-detection
