name: HU-5 membership adjudication projection

on:
  push:
    branches:
      - research/hu5-membership-adjudication

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Select database URL
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL_DIRECT:-}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "$GITHUB_ENV"
          elif [ -n "${DATABASE_URL_POOLED:-}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "$GITHUB_ENV"
          else
            echo "No production database secret is configured" >&2
            exit 1
          fi

      - name: Project reviewed membership adjudication
        run: |
          mkdir -p /tmp/hu5-membership-adjudication
          python -m scripts.research.historical_universe.historical_universe_membership_adjudication \
            --database-url "$DATABASE_URL" \
            --output /tmp/hu5-membership-adjudication/projection.json

      - name: Upload projection evidence
        uses: actions/upload-artifact@v4
        with:
          name: hu5-membership-adjudication-${{ github.run_id }}
          path: /tmp/hu5-membership-adjudication/projection.json
          retention-days: 30
