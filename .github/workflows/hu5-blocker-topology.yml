name: HU-5 blocker topology

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/hu5-blocker-topology
    paths:
      - ".github/workflows/hu5-blocker-topology.yml"
      - "scripts/research/historical_universe/historical_universe_blocker_topology.py"
      - "apps/api/app/models/historical_universe.py"

permissions:
  contents: read

concurrency:
  group: fdre-hu5-blocker-topology-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit blocker security topology
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
      OUTPUT_DIR: data/processed/historical-universe/hu5-blocker-topology

    steps:
      - name: Check required database secret
        run: |
          if { [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; }; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Audit production blocker topology
        run: |
          mkdir -p "${OUTPUT_DIR}"
          python -m scripts.research.historical_universe.historical_universe_blocker_topology \
            --database-url "${DATABASE_URL}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --output "${OUTPUT_DIR}/topology.json"

      - name: Upload topology artifact
        uses: actions/upload-artifact@v4
        with:
          name: hu5-blocker-topology-${{ github.run_id }}
          path: "${{ env.OUTPUT_DIR }}"
          if-no-files-found: error
