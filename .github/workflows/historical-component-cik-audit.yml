name: Historical component CIK audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-component-cik-audit.yml"
      - "scripts/historical_component_cik_audit.py"
      - "src/fdre/research/historical_component_history.py"
      - "src/fdre/research/historical_universe_identity.py"
      - "src/fdre/research/historical_universe_pipeline.py"

permissions:
  contents: read

concurrency:
  group: fdre-historical-component-cik-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Measure HU-2 component CIK recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_DIR: data/cache/historical-component-cik
      OUTPUT_DIR: data/processed/historical-universe/component-cik
      PYTHONPATH: .

    steps:
      - name: Check required database secret
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data]"

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Resolve immutable source revisions
        run: |
          SNP_HISTORY_REF="$(gh api repos/shawnlinxl/snp-history/commits/master --jq .sha)"
          COMPONENT_HISTORY_REF="$(gh api repos/lawcal/sp500-components-history/commits/main --jq .sha)"
          WIKIPEDIA_REVISION="$(curl --fail --location --retry 3 \
            -H "User-Agent: FDRE historical-universe audit kencheng.kc8@gmail.com" \
            'https://en.wikipedia.org/w/api.php?action=query&prop=revisions&titles=Historical_components_of_the_S%26P_500&rvprop=ids&format=json' \
            | python -c 'import json,sys; d=json.load(sys.stdin); print(next(iter(d["query"]["pages"].values()))["revisions"][0]["revid"])')"
          [[ "${SNP_HISTORY_REF}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${COMPONENT_HISTORY_REF}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WIKIPEDIA_REVISION}" =~ ^[0-9]+$ ]]
          echo "SNP_HISTORY_REF=${SNP_HISTORY_REF}" >> "${GITHUB_ENV}"
          echo "COMPONENT_HISTORY_REF=${COMPONENT_HISTORY_REF}" >> "${GITHUB_ENV}"
          echo "WIKIPEDIA_REVISION=${WIKIPEDIA_REVISION}" >> "${GITHUB_ENV}"

      - name: Fetch pinned source copies
        run: |
          mkdir -p "${SOURCE_DIR}"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/shawnlinxl/snp-history/${SNP_HISTORY_REF}/data/history.csv" \
            --output "${SOURCE_DIR}/snp-history.csv"
          curl --fail --location --retry 3 \
            -H "User-Agent: FDRE historical-universe audit kencheng.kc8@gmail.com" \
            "https://en.wikipedia.org/w/index.php?title=Historical_components_of_the_S%26P_500&oldid=${WIKIPEDIA_REVISION}" \
            --output "${SOURCE_DIR}/wikipedia-historical-components.html"
          curl --fail --location --retry 3 \
            -H "User-Agent: FDRE historical-universe audit kencheng.kc8@gmail.com" \
            "https://www.sec.gov/Archives/edgar/cik-lookup-data.txt" \
            --output "${SOURCE_DIR}/sec-cik-lookup-data.txt"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/lawcal/sp500-components-history/${COMPONENT_HISTORY_REF}/data/components_history.csv" \
            --output "${SOURCE_DIR}/components-history.csv"

      - name: Measure component CIK recovery
        run: |
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "${OUTPUT_DIR}"
          python -m scripts.historical_component_cik_audit \
            --database-url "${DATABASE_URL}" \
            --snp-history "${SOURCE_DIR}/snp-history.csv" \
            --wikipedia-html "${SOURCE_DIR}/wikipedia-historical-components.html" \
            --sec-cik-lookup "${SOURCE_DIR}/sec-cik-lookup-data.txt" \
            --component-history "${SOURCE_DIR}/components-history.csv" \
            --component-history-ref "${COMPONENT_HISTORY_REF}" \
            --observed-at "${OBSERVED_AT}" \
            --snp-history-ref "${SNP_HISTORY_REF}" \
            --wikipedia-revision "${WIKIPEDIA_REVISION}" \
            --output "${OUTPUT_DIR}/component-cik-audit.json"

      - name: Publish summary
        if: always()
        run: |
          if [ -f "${OUTPUT_DIR}/component-cik-audit.json" ]; then
            python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path
          payload = json.loads(Path("data/processed/historical-universe/component-cik/component-cik-audit.json").read_text())
          keys = (
              "target_evidence_count", "baseline_resolved_count", "component_history_record_count",
              "component_history_symbol_count", "component_recovered_count", "projected_resolved_count",
              "projected_resolution_rate", "projected_unique_cik_count", "residual_count",
              "residual_component_status_counts",
          )
          print("### HU-2 historical component CIK recovery")
          print("```json")
          print(json.dumps({key: payload[key] for key in keys}, indent=2, sort_keys=True))
          print("```")
          PY
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-component-cik-${{ github.run_id }}
          path: data/processed/historical-universe/component-cik
          if-no-files-found: warn
