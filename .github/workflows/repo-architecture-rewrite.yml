name: Repository architecture rewrite

on:
  push:
    branches:
      - refactor/repo-architecture-cleanup
    paths:
      - ".github/workflows/repo-architecture-rewrite.yml"
      - "scripts/maintenance/apply_architecture_rewrite.py"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: refactor/repo-architecture-cleanup

      - name: Rewrite moved references
        run: python scripts/maintenance/apply_architecture_rewrite.py

      - name: Commit rewritten references
        run: |
          if git diff --quiet; then
            echo "No reference rewrites required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: update domain path references"
          git push origin HEAD:refactor/repo-architecture-cleanup
