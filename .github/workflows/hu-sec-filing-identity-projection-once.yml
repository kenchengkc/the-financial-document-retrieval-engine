name: One-shot HU SEC filing identity projection

on:
  push:
    branches:
      - research/hu-sec-filing-identity-projection

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONPATH: .
      OUTPUT_DIR: data/processed/historical-universe/sec-identity-projection
      TICKER_LINEAGES_REF: c31ac3cc56f28cf9a02b4e694eff7ceab596a0ff

    steps:
      - name: Check required secrets
        run: |
          if { [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; }; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::SEC_USER_AGENT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Download pinned ticker-state history
        run: |
          mkdir -p data/raw/historical-universe
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 60 \
            "https://raw.githubusercontent.com/fja05680/sp500/${TICKER_LINEAGES_REF}/sp500_ticker_start_end.csv" \
            --output data/raw/historical-universe/sp500_ticker_start_end.csv
          test -s data/raw/historical-universe/sp500_ticker_start_end.csv

      - name: Project SEC filing issuer-symbol support
        run: |
          mkdir -p "${OUTPUT_DIR}"
          python -m scripts.research.historical_universe.historical_universe_sec_identity \
            --database-url "${DATABASE_URL}" \
            --ticker-lineages data/raw/historical-universe/sp500_ticker_start_end.csv \
            --ticker-lineages-ref "${TICKER_LINEAGES_REF}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --max-filings-per-identity 2 \
            --output "${OUTPUT_DIR}/projection.json"

      - name: Summarize projection
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("data/processed/historical-universe/sec-identity-projection/projection.json").read_text()
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("### HU SEC filing identity projection\n\n")
              handle.write(f"- Plan ID: `{report['plan_id']}`\n")
              handle.write(
                  f"- Provisional identity periods: **{report['provisional_identity_count']}**\n"
              )
              handle.write(
                  f"- Unique SEC filings fetched: **{report['unique_filing_fetch_count']}**\n"
              )
              handle.write(
                  f"- Filing fetch/extraction errors: **{report['filing_error_count']}**\n"
              )
              handle.write(
                  f"- Explicit SEC TradingSymbol facts: **{report['sec_evidence_count']}**\n"
              )
              handle.write(
                  f"- Identity promotion candidates: **{report['promotion_candidate_count']}**\n"
              )
              handle.write("\n#### Decision counts\n\n")
              for status, count in report["status_counts"].items():
                  handle.write(f"- `{status}`: **{count}**\n")
          PY

      - name: Upload projection artifact
        uses: actions/upload-artifact@v4
        with:
          name: hu-sec-filing-identity-projection-${{ github.run_id }}
          path: data/processed/historical-universe/sec-identity-projection
          if-no-files-found: error
