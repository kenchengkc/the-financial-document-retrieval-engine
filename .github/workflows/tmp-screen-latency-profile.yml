name: Temporary screen latency profile

on:
  push:
    branches:
      - phase0-screen-latency-profile

permissions:
  contents: read

jobs:
  profile:
    if: ${{ contains(github.event.head_commit.message, '[run-screen-latency-profile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      EMBEDDING_PROVIDER: ${{ vars.EMEDDING_PROVIDER || vars.EMBEDDING_PROVIDER || 'local_hash' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'local-hash-v1' }}
      EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '' }}
      SPARSE_PROVIDER: ${{ vars.SPARSE_PROVIDER || 'postgres' }}
      RERANKER_PROVIDER: ${{ vars.RERANKER_PROVIDER || 'none' }}
      RERANKER_MODEL: ${{ vars.RERANKER_MODEL || 'rerank-2.5' }}
      RERANK_TOP_N: ${{ vars.RERANK_TOP_N || '50' }}
      MIN_RERANK_SCORE: ${{ vars.MIN_RERANK_SCORE || '0' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      FDRE_ALLOW_PROD: '1'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Select production database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi
      - name: Profile internal and deployed screen paths
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import statistics
          from collections import defaultdict
          from pathlib import Path
          from time import perf_counter
          from typing import Any

          import httpx
          from sqlalchemy import event
          from sqlalchemy.engine import Engine
          from sqlalchemy.orm import Session

          from apps.api.app.config import get_settings
          from apps.api.app.db import create_db_engine
          from apps.api.app.services.retrieval_service import search_documents
          from fdre.evals import build_cross_sectional_screen_plan, load_cross_sectional_benchmark
          import fdre.research.screen as screen_module
          from fdre.retrieval.query import RetrievalCandidate, SearchFilters

          DATASET = Path('data/evals/cross_sectional_benchmark.v2.development.jsonl')
          OUTPUT = Path('data/processed/evals/screen-latency-profile.json')
          API_URL = 'https://api.thefdre.com/research/screen'
          REPEATS = 2
          TASK_COUNTS = {
              'structured_screen': 1,
              'change_screen': 1,
              'semantic_screen': 2,
              'semantic_structured_screen': 1,
          }

          questions = load_cross_sectional_benchmark(DATASET)
          selected = []
          remaining = dict(TASK_COUNTS)
          for question in questions:
              task = question.resolved_task_type
              if remaining.get(task, 0) > 0:
                  selected.append(question)
                  remaining[task] -= 1
          assert all(value == 0 for value in remaining.values()), remaining

          settings = get_settings()
          engine = create_db_engine()
          current_stage = {'name': 'idle'}
          query_started: dict[int, float] = {}
          db_stats: dict[str, dict[str, float]] = defaultdict(lambda: {'count': 0.0, 'ms': 0.0})

          @event.listens_for(engine, 'before_cursor_execute')
          def before_cursor_execute(
              conn: Any,
              cursor: Any,
              statement: str,
              parameters: Any,
              context: Any,
              executemany: bool,
          ) -> None:
              query_started[id(context)] = perf_counter()

          @event.listens_for(engine, 'after_cursor_execute')
          def after_cursor_execute(
              conn: Any,
              cursor: Any,
              statement: str,
              parameters: Any,
              context: Any,
              executemany: bool,
          ) -> None:
              started = query_started.pop(id(context), None)
              if started is None:
                  return
              stage = current_stage['name']
              db_stats[stage]['count'] += 1
              db_stats[stage]['ms'] += (perf_counter() - started) * 1000

          original_panel = screen_module.build_research_panel
          original_evidence = screen_module._latest_filing_evidence
          active: dict[str, float] = {}

          def timed_panel(*args: Any, **kwargs: Any) -> Any:
              previous = current_stage['name']
              current_stage['name'] = 'panel'
              started = perf_counter()
              try:
                  return original_panel(*args, **kwargs)
              finally:
                  active['panel_ms'] = (perf_counter() - started) * 1000
                  current_stage['name'] = previous

          def timed_evidence(*args: Any, **kwargs: Any) -> Any:
              previous = current_stage['name']
              current_stage['name'] = 'evidence_filter'
              started = perf_counter()
              try:
                  return original_evidence(*args, **kwargs)
              finally:
                  active['evidence_filter_ms'] = (perf_counter() - started) * 1000
                  current_stage['name'] = previous

          screen_module.build_research_panel = timed_panel
          screen_module._latest_filing_evidence = timed_evidence

          internal_records: list[dict[str, Any]] = []
          with Session(engine) as session:
              for repeat in range(REPEATS):
                  for question in selected:
                      plan = build_cross_sectional_screen_plan(question)
                      active = {}
                      before_db = {stage: values.copy() for stage, values in db_stats.items()}

                      def semantic_search(
                          query: str,
                          filters: SearchFilters,
                          top_k: int,
                      ) -> list[RetrievalCandidate]:
                          previous = current_stage['name']
                          current_stage['name'] = 'semantic_search'
                          started = perf_counter()
                          try:
                              result = search_documents(
                                  session,
                                  settings,
                                  query=query,
                                  filters=filters,
                                  top_k=top_k,
                              )
                              active['semantic_service_ms'] = float(result.latency_ms)
                              return result.candidates
                          finally:
                              active['semantic_search_ms'] = (perf_counter() - started) * 1000
                              current_stage['name'] = previous

                      current_stage['name'] = 'screen_other'
                      started = perf_counter()
                      response = screen_module.execute_research_screen(
                          session,
                          plan,
                          semantic_search=semantic_search,
                      )
                      total_ms = (perf_counter() - started) * 1000
                      current_stage['name'] = 'idle'

                      stage_db: dict[str, dict[str, float]] = {}
                      for stage, values in db_stats.items():
                          prior = before_db.get(stage, {'count': 0.0, 'ms': 0.0})
                          count = values['count'] - prior['count']
                          ms = values['ms'] - prior['ms']
                          if count or ms:
                              stage_db[stage] = {'count': int(count), 'ms': round(ms, 2)}

                      known_ms = sum(
                          active.get(key, 0.0)
                          for key in ('panel_ms', 'semantic_search_ms', 'evidence_filter_ms')
                      )
                      internal_records.append({
                          'question_id': question.question_id,
                          'task_type': question.resolved_task_type,
                          'repeat': repeat + 1,
                          'semantic': plan.semantic_query is not None,
                          'total_ms': round(total_ms, 2),
                          'panel_ms': round(active.get('panel_ms', 0.0), 2),
                          'semantic_search_ms': round(active.get('semantic_search_ms', 0.0), 2),
                          'semantic_service_ms': round(active.get('semantic_service_ms', 0.0), 2),
                          'semantic_persist_overhead_ms': round(
                              max(0.0, active.get('semantic_search_ms', 0.0) - active.get('semantic_service_ms', 0.0)),
                              2,
                          ),
                          'evidence_filter_ms': round(active.get('evidence_filter_ms', 0.0), 2),
                          'other_ms': round(max(0.0, total_ms - known_ms), 2),
                          'db': stage_db,
                          'matched_count': response.manifest.matched_count,
                          'semantic_candidate_count': response.manifest.semantic_candidate_count,
                      })

          route_records: list[dict[str, Any]] = []
          with httpx.Client(timeout=30.0) as client:
              for repeat in range(REPEATS):
                  for question in selected:
                      plan = build_cross_sectional_screen_plan(question)
                      started = perf_counter()
                      response = client.post(API_URL, json=plan.model_dump(mode='json'))
                      wall_ms = (perf_counter() - started) * 1000
                      payload: dict[str, Any] = {}
                      if response.status_code == 200:
                          payload = response.json()
                      route_records.append({
                          'question_id': question.question_id,
                          'task_type': question.resolved_task_type,
                          'repeat': repeat + 1,
                          'status_code': response.status_code,
                          'wall_ms': round(wall_ms, 2),
                          'server_latency_ms': payload.get('latency_ms'),
                          'route_overhead_ms': (
                              round(max(0.0, wall_ms - float(payload['latency_ms'])), 2)
                              if payload.get('latency_ms') is not None
                              else None
                          ),
                          'matched_count': (payload.get('manifest') or {}).get('matched_count'),
                          'semantic_candidate_count': (payload.get('manifest') or {}).get('semantic_candidate_count'),
                          'detail': payload.get('detail') if response.status_code != 200 else None,
                      })

          def summarize(records: list[dict[str, Any]], field: str) -> dict[str, float]:
              values = [float(record[field]) for record in records if record.get(field) is not None]
              if not values:
                  return {'n': 0, 'mean': 0.0, 'p50': 0.0, 'p95': 0.0, 'max': 0.0}
              ordered = sorted(values)
              p95_index = round(0.95 * (len(ordered) - 1))
              return {
                  'n': len(values),
                  'mean': round(statistics.fmean(values), 2),
                  'p50': round(statistics.median(values), 2),
                  'p95': round(ordered[p95_index], 2),
                  'max': round(max(values), 2),
              }

          task_summary: dict[str, Any] = {}
          for task in TASK_COUNTS:
              internal = [r for r in internal_records if r['task_type'] == task]
              route = [r for r in route_records if r['task_type'] == task]
              task_summary[task] = {
                  'internal_total_ms': summarize(internal, 'total_ms'),
                  'panel_ms': summarize(internal, 'panel_ms'),
                  'semantic_search_ms': summarize(internal, 'semantic_search_ms'),
                  'semantic_service_ms': summarize(internal, 'semantic_service_ms'),
                  'semantic_persist_overhead_ms': summarize(internal, 'semantic_persist_overhead_ms'),
                  'evidence_filter_ms': summarize(internal, 'evidence_filter_ms'),
                  'other_ms': summarize(internal, 'other_ms'),
                  'route_wall_ms': summarize(route, 'wall_ms'),
                  'route_server_latency_ms': summarize(route, 'server_latency_ms'),
                  'route_overhead_ms': summarize(route, 'route_overhead_ms'),
              }

          report = {
              'git_sha': '4767412157a02ad9d4d68195243d28251848427e',
              'dataset': str(DATASET),
              'api_url': API_URL,
              'repeats': REPEATS,
              'selected_question_ids': [q.question_id for q in selected],
              'settings': {
                  'embedding_provider': settings.embedding_provider,
                  'embedding_model': settings.embedding_model,
                  'embedding_dimensions': settings.embedding_dimensions,
                  'reranker_provider': settings.reranker_provider,
                  'reranker_model': settings.reranker_model,
                  'rerank_top_n': settings.rerank_top_n,
              },
              'task_summary': task_summary,
              'internal_records': internal_records,
              'route_records': route_records,
          }
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          OUTPUT.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'task_summary': task_summary, 'selected_question_ids': report['selected_question_ids']}, indent=2))
          PY
      - name: Upload latency profile
        uses: actions/upload-artifact@v4
        with:
          name: screen-latency-profile-${{ github.sha }}
          path: data/processed/evals/screen-latency-profile.json
          if-no-files-found: error
          retention-days: 14
