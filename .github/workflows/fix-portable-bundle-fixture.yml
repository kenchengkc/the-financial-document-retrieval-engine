name: Repair portable bundle fixture

on:
  push:
    branches:
      - feature/portable-experiment-bundle

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make experiment fixture schema-valid
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/fdre/test_experiment_registry.py")
          text = path.read_text()

          replacements = [
              (
                  "from fdre.research.oos_diagnostics import OOSDiagnosticsReport",
                  "from fdre.research.event_study import EventStudyConfig\nfrom fdre.research.oos_diagnostics import OOSDiagnosticsConfig, OOSDiagnosticsReport",
              ),
              (
                  "from fdre.research.walk_forward import WalkForwardOOSObservation, WalkForwardStudyReport",
                  "from fdre.research.walk_forward import (\n    WalkForwardConfig,\n    WalkForwardOOSObservation,\n    WalkForwardStudyReport,\n)",
              ),
              (
                  '        feature_lineage_digest="lineage-sha",\n        folds=[],\n        oos_observations=[observation],',
                  '        feature_lineage_digest="lineage-sha",\n        event_study_config=EventStudyConfig(),\n        walk_forward_config=WalkForwardConfig(),\n        fold_count=0,\n        eligible_fold_count=0,\n        oos_event_count=1,\n        oos_observation_count=1,\n        folds=[],\n        oos_observations=[observation],',
              ),
              (
                  '        outcome_name=source.outcome_name,\n        sealed_oos=True,\n        windows=[],\n        folds=[],',
                  '        outcome_name=source.outcome_name,\n        sealed_oos=True,\n        status="ready",\n        dataset_version=source.dataset_version,\n        feature_version=source.feature_version,\n        market_data_version=source.market_data_version,\n        universe_snapshot_id=source.universe_snapshot_id,\n        feature_snapshot_id=source.feature_snapshot_id,\n        code_sha=source.code_sha,\n        source_eligible_fold_count=source.eligible_fold_count,\n        source_oos_event_count=source.oos_event_count,\n        source_oos_observation_count=source.oos_observation_count,\n        config=OOSDiagnosticsConfig(),\n        windows=[],\n        folds=[],',
              ),
              (
                  '                hypothesis_id="hypothesis-1",\n                source_experiment_key="walk-1",\n                signal_name=source.signal_name,\n                outcome_name=source.outcome_name,\n                window="1:21",\n                status="passes_statistical_gate",',
                  '                hypothesis_id="hypothesis-1",\n                source_diagnostics_key=diagnostics.diagnostics_key,\n                source_experiment_key="walk-1",\n                signal_name=source.signal_name,\n                outcome_name=source.outcome_name,\n                window="1:21",\n                status="passes_statistical_gate",\n                ic_fold_count=4,\n                ic_mean=0.05,\n                icir=1.0,\n                positive_ic_share=1.0,\n                quantile_monotonicity_mean=0.8,\n                long_short_mean=0.01,\n                positive_long_short_share=1.0,\n                raw_p_value=0.01,\n                adjusted_q_value=0.01,\n                inference_method="test_fixture",',
              ),
              (
                  '    selection = OOSSelectionSuiteReport.model_construct(\n        selection_key="selection-1",\n        config=OOSSelectionConfig(),',
                  '    selection = OOSSelectionSuiteReport.model_construct(\n        selection_key="selection-1",\n        declared_hypothesis_count=1,\n        tested_hypothesis_count=1,\n        passing_count=1,\n        rejected_count=0,\n        insufficient_count=0,\n        input_diagnostics_keys=[diagnostics.diagnostics_key],\n        source_code_digest="fixture-code-digest",\n        config=OOSSelectionConfig(),',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"fixture marker not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit repaired fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/fdre/test_experiment_registry.py
          git commit -m "test: use schema-valid bundle artifacts"
          git push
