name: Retrieval archive scope audit (one-shot)

on:
  push:
    branches:
      - fix/retrieval-archive-indexing
    paths:
      - ".github/workflows/retrieval-archive-scope-audit-once.yml"
      - "scripts/ingestion/audit_retrieval_archive_scope.py"
      - "src/fdre/retrieval/scope.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only production archive/retrieval audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      EMBEDDING_PROVIDER: voyage
      EMBEDDING_MODEL: voyage-4-large
      EMBEDDING_DIMENSIONS: "512"
      PYTHONPATH: .
    steps:
      - name: Check required database secret
        run: |
          if { [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; }; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data]"

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Run read-only archive scope audit
        run: |
          mkdir -p data/processed/ops
          python -m scripts.ingestion.audit_retrieval_archive_scope \
            --database-url "${DATABASE_URL}" \
            --output data/processed/ops/retrieval-archive-scope-audit.json
          {
            echo "### Retrieval archive scope audit"
            echo '```json'
            cat data/processed/ops/retrieval-archive-scope-audit.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-archive-scope-audit-${{ github.run_id }}
          path: data/processed/ops/retrieval-archive-scope-audit.json
          if-no-files-found: error
          retention-days: 30
