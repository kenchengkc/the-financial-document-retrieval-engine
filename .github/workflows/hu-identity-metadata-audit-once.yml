name: One-shot HU SEC Company Facts identity audit

on:
  push:
    branches:
      - ops/hu-identity-audit-2026-09-03
    paths:
      - ".github/workflows/hu-identity-metadata-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONPATH: .

    steps:
      - name: Check required secrets
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::SEC_USER_AGENT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Audit SEC Company Facts identity evidence
        run: |
          mkdir -p data/processed/historical-universe/company-facts-identity-audit
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          from collections import Counter
          from datetime import date
          from pathlib import Path
          from typing import Any

          from sqlalchemy import select
          from sqlalchemy.orm import Session

          from apps.api.app.db import create_db_engine
          from apps.api.app.models.companies import Company
          from apps.api.app.models.historical_universe import (
              Security,
              SecurityIdentityPeriod,
              UniverseMembership,
          )
          from fdre.ingestion.sec_client import SECClient

          WINDOW_START = date(2010, 1, 1)
          WINDOW_END = date(2026, 9, 1)

          def normalize_key(value: str) -> str:
              return re.sub(r"[^a-z0-9]", "", value.casefold())

          def normalize_symbol(value: object) -> str:
              return str(value).strip().upper().replace(".", "-")

          def string_values(value: Any, prefix: str = "") -> list[tuple[str, str]]:
              found: list[tuple[str, str]] = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      path = f"{prefix}.{key}" if prefix else str(key)
                      found.extend(string_values(child, path))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      found.extend(string_values(child, f"{prefix}[{index}]"))
              elif isinstance(value, str):
                  found.append((prefix, value))
              return found

          engine = create_db_engine(os.environ["DATABASE_URL"])
          try:
              with Session(engine) as session:
                  security_ids = tuple(
                      sorted(
                          {
                              int(value)
                              for value in session.scalars(
                                  select(UniverseMembership.security_id).where(
                                      UniverseMembership.universe_code == "sp500",
                                      UniverseMembership.verification_status != "rejected",
                                      UniverseMembership.effective_from <= WINDOW_END,
                                      (
                                          UniverseMembership.effective_to.is_(None)
                                          | (UniverseMembership.effective_to > WINDOW_START)
                                      ),
                                  )
                              )
                          }
                      )
                  )
                  identities = session.execute(
                      select(
                          SecurityIdentityPeriod.id,
                          SecurityIdentityPeriod.security_id,
                          SecurityIdentityPeriod.symbol,
                          SecurityIdentityPeriod.effective_from,
                          SecurityIdentityPeriod.effective_to,
                          Company.cik,
                      )
                      .join(Security, Security.id == SecurityIdentityPeriod.security_id)
                      .join(Company, Company.id == Security.company_id)
                      .where(
                          SecurityIdentityPeriod.security_id.in_(security_ids),
                          SecurityIdentityPeriod.verification_status == "provisional",
                          SecurityIdentityPeriod.effective_from <= WINDOW_END,
                          (
                              SecurityIdentityPeriod.effective_to.is_(None)
                              | (SecurityIdentityPeriod.effective_to > WINDOW_START)
                          ),
                      )
                      .order_by(SecurityIdentityPeriod.id)
                  ).all()
          finally:
              engine.dispose()

          identities_by_cik: dict[str, list[object]] = {}
          for identity in identities:
              identities_by_cik.setdefault(str(identity.cik).zfill(10), []).append(identity)

          concept_counts: Counter[str] = Counter()
          payloads_with_trading_symbol_concept = 0
          payloads_with_candidate_symbol_string = 0
          exact_identity_matches: set[int] = set()
          errors: list[dict[str, str]] = []
          samples: list[dict[str, object]] = []
          payload_hashes: dict[str, str] = {}

          with SECClient.from_settings() as client:
              for cik in sorted(identities_by_cik):
                  try:
                      payload = client.get_company_facts(cik)
                  except Exception as exc:
                      errors.append({"cik": cik, "error": f"{type(exc).__name__}: {exc}"})
                      continue
                  encoded = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
                  payload_hashes[cik] = hashlib.sha256(encoded).hexdigest()
                  facts = payload.get("facts")
                  if not isinstance(facts, dict):
                      continue
                  dei = facts.get("dei")
                  if not isinstance(dei, dict):
                      continue

                  trading_concepts: list[tuple[str, object]] = []
                  for concept, concept_payload in dei.items():
                      normalized = normalize_key(str(concept))
                      concept_counts[normalized] += 1
                      if "tradingsymbol" in normalized or normalized in {"ticker", "symbol"}:
                          trading_concepts.append((str(concept), concept_payload))
                  if trading_concepts:
                      payloads_with_trading_symbol_concept += 1

                  identity_rows = identities_by_cik[cik]
                  expected_by_symbol = {
                      normalize_symbol(identity.symbol): identity for identity in identity_rows
                  }
                  candidate_strings: list[tuple[str, str]] = []
                  for concept, concept_payload in trading_concepts:
                      for path, value in string_values(concept_payload, f"dei.{concept}"):
                          candidate_strings.append((path, value))
                          matched = expected_by_symbol.get(normalize_symbol(value))
                          if matched is not None:
                              exact_identity_matches.add(int(matched.id))
                  if candidate_strings:
                      payloads_with_candidate_symbol_string += 1
                  if (trading_concepts or candidate_strings) and len(samples) < 80:
                      samples.append(
                          {
                              "cik": cik,
                              "expected_symbols": sorted(expected_by_symbol),
                              "trading_concepts": [name for name, _ in trading_concepts],
                              "candidate_strings": candidate_strings[:50],
                          }
                      )

          payload = {
              "schema_version": "fdre-hu-company-facts-identity-audit-v1",
              "window_start": WINDOW_START.isoformat(),
              "window_end": WINDOW_END.isoformat(),
              "provisional_identity_count": len(identities),
              "provisional_identity_cik_count": len(identities_by_cik),
              "company_facts_payload_count": len(payload_hashes),
              "company_facts_error_count": len(errors),
              "payloads_with_trading_symbol_concept": payloads_with_trading_symbol_concept,
              "payloads_with_candidate_symbol_string": payloads_with_candidate_symbol_string,
              "exact_provisional_identity_match_count": len(exact_identity_matches),
              "dei_concept_counts": dict(sorted(concept_counts.items())),
              "payload_hashes": payload_hashes,
              "errors": errors,
              "samples": samples,
          }
          output = Path(
              "data/processed/historical-universe/company-facts-identity-audit/report.json"
          )
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("### HU SEC Company Facts identity audit\n\n")
              handle.write(f"- Provisional identity periods: **{len(identities)}**\n")
              handle.write(f"- Issuer CIKs queried: **{len(identities_by_cik)}**\n")
              handle.write(f"- Successful Company Facts payloads: **{len(payload_hashes)}**\n")
              handle.write(f"- SEC request errors: **{len(errors)}**\n")
              handle.write(
                  "- Payloads exposing a trading-symbol concept: "
                  f"**{payloads_with_trading_symbol_concept}**\n"
              )
              handle.write(
                  "- Exact provisional identities matched from Company Facts: "
                  f"**{len(exact_identity_matches)}**\n"
              )
          PY

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: hu-company-facts-identity-audit-${{ github.run_id }}
          path: data/processed/historical-universe/company-facts-identity-audit
          if-no-files-found: error
