name: Historical Universe SGPPRB projection

on:
  push:
    branches:
      - research/hu-sgpprb-adjudication
    paths:
      - ".github/workflows/historical-universe-sgpprb-projection.yml"
      - "scripts/research/historical_universe/historical_universe_security_type_projection.py"
      - "scripts/research/historical_universe/historical_universe_sgpprb_discovery.py"
      - "src/fdre/research/historical_universe_security_type.py"
      - "src/fdre/research/hu5_universe.py"
      - "apps/api/app/models/historical_universe.py"
      - "tests/unit/fdre/test_historical_universe_security_type.py"

permissions:
  contents: read

concurrency:
  group: fdre-historical-universe-sgpprb-projection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  project:
    name: Read-only production SGPPRB projection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONPATH: .
      OUTPUT_DIR: data/processed/historical-universe/sgpprb-adjudication

    steps:
      - name: Check required secrets
        run: |
          if { [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; }; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::SEC_USER_AGENT is required for live SEC requests."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Discover and project SEC-backed SGPPRB adjudication
        run: |
          mkdir -p "${OUTPUT_DIR}"
          python -m scripts.research.historical_universe.historical_universe_sgpprb_discovery \
            --database-url "${DATABASE_URL}" \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --output "${OUTPUT_DIR}/projection.json"

      - name: Validate discovery invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/processed/historical-universe/sgpprb-adjudication/projection.json")
          payload = json.loads(path.read_text())
          discovery = payload["discovery"]
          membership = discovery["membership"]
          evidence = payload["sec_evidence"]

          assert payload["mode"] == "projection"
          assert payload["applied"] is False
          assert payload["known_blocker_membership_id"] == 580
          assert payload["target_sec_cik"] == "0000310158"
          assert payload["target_symbol"] == "SGPPRB"
          assert membership["row_id"] == 580
          assert membership["universe_code"] == "sp500"
          assert len(membership["source_hash"]) == 64
          assert evidence["cik"] == "0000310158"
          assert evidence["listed_symbol"] == "SGPPRB"
          assert evidence["security_type"] == "preferred_stock"
          assert evidence["common_symbol"] == "SGP"
          assert len(evidence["evidence_id"]) == 64
          assert len(evidence["payload_sha256"]) == 64
          assert len(payload["plan_id"]) == 64
          assert payload["staged_rejection_count"] == payload["rejection_candidate_count"]
          assert 0 <= payload["rejection_candidate_count"] <= 2
          assert discovery["overlapping_sgpprb_identity_count"] == len(
              discovery["overlapping_sgpprb_identities"]
          )
          for identity in discovery["identity_periods"]:
              assert len(identity["source_hash"]) == 64
          print(json.dumps({
              "plan_id": payload["plan_id"],
              "sec_evidence_id": evidence["evidence_id"],
              "sec_payload_sha256": evidence["payload_sha256"],
              "membership": membership,
              "security": discovery["security"],
              "company": discovery["company"],
              "bridge_status": discovery["bridge_status"],
              "issuer_matches_sec_evidence": discovery["issuer_matches_sec_evidence"],
              "overlapping_sgpprb_identities": discovery["overlapping_sgpprb_identities"],
              "all_identity_periods": discovery["identity_periods"],
              "decisions": payload["decisions"],
              "rejection_candidate_count": payload["rejection_candidate_count"],
              "strict_before": payload["strict_coverage_before"],
              "strict_projected": payload["strict_coverage_projected"],
          }, indent=2, sort_keys=True))
          PY

      - name: Summarize projection
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("data/processed/historical-universe/sgpprb-adjudication/projection.json").read_text()
          )
          discovery = payload["discovery"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("### SGPPRB security-type discovery/adjudication\n\n")
              handle.write(f"- Plan ID: `{payload['plan_id']}`\n")
              handle.write(f"- SEC evidence ID: `{payload['sec_evidence']['evidence_id']}`\n")
              handle.write(f"- SEC payload SHA-256: `{payload['sec_evidence']['payload_sha256']}`\n")
              handle.write(
                  f"- Live company CIK: `{discovery['company']['cik']}`; SEC evidence CIK: "
                  f"`{payload['sec_evidence']['cik']}`\n"
              )
              handle.write(f"- Bridge status: **{discovery['bridge_status']}**\n")
              handle.write(
                  f"- Overlapping SGPPRB identities: "
                  f"**{discovery['overlapping_sgpprb_identity_count']}**\n"
              )
              handle.write(f"- Rejection candidates: **{payload['rejection_candidate_count']}**\n")
              membership = discovery["membership"]
              handle.write(
                  f"- Membership row **{membership['row_id']}** / security "
                  f"**{membership['security_id']}**: `{membership['effective_from']}` → "
                  f"`{membership['effective_to']}` / `{membership['verification_status']}` / "
                  f"source `{membership['source_hash']}`\n"
              )
              for identity in discovery["overlapping_sgpprb_identities"]:
                  handle.write(
                      f"- SGPPRB identity row **{identity['row_id']}**: "
                      f"`{identity['effective_from']}` → `{identity['effective_to']}` / "
                      f"`{identity['verification_status']}` / source `{identity['source_hash']}`\n"
                  )
              before = payload["strict_coverage_before"]
              after = payload["strict_coverage_projected"]
              handle.write(
                  f"- Strict eligible days: **{before['strict_eligible_day_count']} → "
                  f"{after['strict_eligible_day_count']}** of {before['day_count']}\n"
              )
          PY

      - name: Upload projection artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-universe-sgpprb-projection-${{ github.run_id }}
          path: data/processed/historical-universe/sgpprb-adjudication
          if-no-files-found: error
          retention-days: 30
