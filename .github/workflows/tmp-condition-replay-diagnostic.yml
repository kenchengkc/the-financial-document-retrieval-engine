name: Temporary condition replay diagnostic

on:
  push:
    branches:
      - phase0-post7-condition-replay-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[run-condition-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'local_hash' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'local-hash-v1' }}
      EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '' }}
      SPARSE_PROVIDER: ${{ vars.SPARSE_PROVIDER || 'postgres' }}
      RERANKER_PROVIDER: ${{ vars.RERANKER_PROVIDER || 'none' }}
      RERANKER_MODEL: ${{ vars.RERANKER_MODEL || 'rerank-2.5' }}
      RERANK_TOP_N: ${{ vars.RERANK_TOP_N || '50' }}
      MIN_RERANK_SCORE: ${{ vars.MIN_RERANK_SCORE || '0' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      FDRE_ALLOW_PROD: '1'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Select production database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi
      - name: Replay reviewed development conditions
        run: |
          python scripts/evaluate_cross_sectional.py \
            data/evals/cross_sectional_benchmark.v2.conditions.dev.jsonl \
            --split development \
            --ks 1 3 5 \
            --output-dir data/processed/evals/condition-replay-dev-current
      - name: Explain field-level mismatches
        run: |
          python scripts/diagnose_condition_replay.py \
            data/evals/cross_sectional_benchmark.v2.conditions.dev.jsonl \
            --split development \
            --output data/processed/evals/condition-replay-diagnostic.json
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: condition-replay-dev-${{ github.sha }}
          path: |
            data/processed/evals/condition-replay-dev-current/
            data/processed/evals/condition-replay-diagnostic.json
          if-no-files-found: error
          retention-days: 14
