name: Temporary Part 7.5 first holdout evaluation

on:
  push:
    branches:
      - phase0-part7-5-holdout-first-run

permissions:
  contents: read

jobs:
  first-holdout-evaluation:
    if: ${{ contains(github.event.head_commit.message, '[run-v2-holdout-first]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'local_hash' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'local-hash-v1' }}
      EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '' }}
      SPARSE_PROVIDER: ${{ vars.SPARSE_PROVIDER || 'postgres' }}
      RERANKER_PROVIDER: ${{ vars.RERANKER_PROVIDER || 'none' }}
      RERANKER_MODEL: ${{ vars.RERANKER_MODEL || 'rerank-2.5' }}
      RERANK_TOP_N: ${{ vars.RERANK_TOP_N || '50' }}
      MIN_RERANK_SCORE: ${{ vars.MIN_RERANK_SCORE || '0' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      FDRE_ALLOW_PROD: '1'
      PYTHONPATH: .
    steps:
      - name: Check out exact evaluation commit
        uses: actions/checkout@v6

      - name: Validate configured production retrieval dependencies
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi
          if [ "${EMBEDDING_PROVIDER}" = "voyage" ] && [ -z "${VOYAGE_API_KEY}" ]; then
            echo "::error::VOYAGE_API_KEY is required for the configured embedding provider."
            exit 1
          fi
          if [ "${EMBEDDING_PROVIDER}" = "openai" ] && [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY is required for the configured embedding provider."
            exit 1
          fi
          if [ "${RERANKER_PROVIDER}" = "voyage" ] && [ -z "${VOYAGE_API_KEY}" ]; then
            echo "::error::VOYAGE_API_KEY is required for the configured reranker."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Select production database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Execute sealed holdout exactly once for Part 7.5
        run: |
          python scripts/evaluate_cross_sectional.py \
            data/evals/cross_sectional_benchmark.v2.holdout.jsonl \
            --split holdout \
            --ks 1 3 5 \
            --output-dir data/processed/evals/cross-sectional-v2-holdout-first-run \
            --allow-sealed-holdout

      - name: Hash first-run artifacts
        run: |
          sha256sum data/processed/evals/cross-sectional-v2-holdout-first-run/* \
            | tee data/processed/evals/cross-sectional-v2-holdout-first-run/SHA256SUMS

      - name: Upload immutable first-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: part7-5-v2-holdout-first-run-${{ github.sha }}
          path: data/processed/evals/cross-sectional-v2-holdout-first-run/
          if-no-files-found: error
          retention-days: 90
