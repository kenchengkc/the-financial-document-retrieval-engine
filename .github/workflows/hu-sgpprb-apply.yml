name: Historical Universe SGPPRB rejection apply

on:
  workflow_dispatch:
    inputs:
      expected_plan_id:
        description: "Exact SGPPRB adjudication plan to replay"
        required: true
        default: "f386c335fcdbcfa3eb9633dad132f2454a03f4b05baa127802311c4d724ce580"
        type: string
      apply_supported:
        description: "Commit the exact validated membership rejection to production"
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.actor == 'kenchengkc' &&
       github.event.issue.number == 84 &&
       github.event.comment.body == '/hu5-reject-sgpprb f386c335fcdbcfa3eb9633dad132f2454a03f4b05baa127802311c4d724ce580')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONPATH: .
      OUTPUT_DIR: data/processed/historical-universe/sgpprb-apply
      FROZEN_PLAN_ID: f386c335fcdbcfa3eb9633dad132f2454a03f4b05baa127802311c4d724ce580

    steps:
      - name: Resolve guarded request
        if: ${{ github.event_name == 'issue_comment' }}
        run: echo "EXPECTED_PLAN_ID=${FROZEN_PLAN_ID}" >> "${GITHUB_ENV}"

      - name: Resolve manual request
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCH_EXPECTED_PLAN_ID: ${{ inputs.expected_plan_id }}
        run: echo "EXPECTED_PLAN_ID=${DISPATCH_EXPECTED_PLAN_ID}" >> "${GITHUB_ENV}"

      - name: Check required secrets
        run: |
          if { [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; }; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::SEC_USER_AGENT is required."
            exit 1
          fi
          if [ -z "${EXPECTED_PLAN_ID}" ]; then
            echo "::error::Expected plan ID is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Select database URL
        run: |
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Replay read-only SGPPRB projection
        run: |
          mkdir -p "${OUTPUT_DIR}"
          python -m scripts.research.historical_universe.historical_universe_sgpprb_projection \
            --database-url "${DATABASE_URL}" \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --output "${OUTPUT_DIR}/projection.json"

      - name: Verify frozen projection
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("data/processed/historical-universe/sgpprb-apply/projection.json").read_text()
          )
          if report["plan_id"] != os.environ["EXPECTED_PLAN_ID"]:
              raise SystemExit(
                  f"plan drift: expected {os.environ['EXPECTED_PLAN_ID']}, got {report['plan_id']}"
              )
          if report["rejection_candidate_count"] != 1:
              raise SystemExit("projection must contain exactly one rejection candidate")
          if report["staged_rejection_count"] != 1:
              raise SystemExit("projection must stage exactly one rolled-back rejection")
          PY

      - name: Apply exact SGPPRB membership rejection
        if: ${{ github.event_name == 'issue_comment' || inputs.apply_supported }}
        env:
          FDRE_ALLOW_PROD: "1"
        run: |
          python -m scripts.research.historical_universe.historical_universe_sgpprb_apply \
            --database-url "${DATABASE_URL}" \
            --projection "${OUTPUT_DIR}/projection.json" \
            --expected-plan-id "${EXPECTED_PLAN_ID}" \
            --apply \
            --output "${OUTPUT_DIR}/apply.json"

      - name: Audit strict coverage after apply
        if: ${{ github.event_name == 'issue_comment' || inputs.apply_supported }}
        run: |
          python -m scripts.research.historical_universe.historical_universe_strict_coverage \
            --database-url "${DATABASE_URL}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --output "${OUTPUT_DIR}/strict-coverage-after-apply.json"

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hu-sgpprb-apply-${{ github.run_id }}
          path: data/processed/historical-universe/sgpprb-apply
          if-no-files-found: error
