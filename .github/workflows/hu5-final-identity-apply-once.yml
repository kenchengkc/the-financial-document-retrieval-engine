name: HU-5 final identity apply

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read

concurrency:
  group: hu5-final-identity-apply
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor == 'kenchengkc' &&
      github.event.comment.user.login == 'kenchengkc' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.issue.number == 84 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == '/hu5-apply-final-identities 96628d4fc51ffd0c8322cffd092d8526d286fcf71a262171bb7ebcf042fa8a22 d73f752121f42f642f4881e295d7e7b72b56479e276265b7942df274484cc271 37 5 3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OUTPUT_DIR: data/processed/historical-universe/final-identity-apply
      EXPECTED_MANIFEST_ID: 96628d4fc51ffd0c8322cffd092d8526d286fcf71a262171bb7ebcf042fa8a22
      EXPECTED_PLAN_ID: d73f752121f42f642f4881e295d7e7b72b56479e276265b7942df274484cc271
      EXPECTED_AUDIT_ID: b5dc9108a2cfbbb9d4717aa1cb52dc751e31734bb5188ec5d8e05499db64245a
      EXPECTED_TOPOLOGY_ID: 5e30e1075c71c6578fd60e550ae1518538b680f35c9c9003d4b48372a74821e9

    steps:
      - name: Check required database secret
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out reviewed main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Select database URL
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Download and hash-check both frozen artifacts
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          repo = os.environ["GITHUB_REPOSITORY"]
          frozen = (
              (33843412242, 9925706591, "hu5-residual-sec-evidence-33843412242",
               "sha256:aeefd076f5301c4fae186708a6b799caedfd9ce7e1dfe94bc54c7c7361605cf1",
               ("topology.json", "sec-evidence.json")),
              (33908491559, 9950441480, "hu5-final-identity-projection-33908491559",
               "sha256:26595955dc6799e72bac5a6aec8e9ec7ac5f7f2d1d000665da0405c533da05ee",
               ("projection.json",)),
          )
          provenance = []
          for run_id, artifact_id, name, digest, filenames in frozen:
              endpoint = f"repos/{repo}/actions/artifacts/{artifact_id}"
              metadata = json.loads(subprocess.check_output(["gh", "api", endpoint]))
              if (
                  metadata["id"] != artifact_id or metadata["name"] != name
                  or metadata["digest"] != digest or metadata["expired"]
                  or metadata["workflow_run"]["id"] != run_id
              ):
                  raise SystemExit(f"Frozen artifact metadata drifted: {artifact_id}")
              archive = subprocess.check_output(["gh", "api", endpoint + "/zip"])
              actual_digest = "sha256:" + hashlib.sha256(archive).hexdigest()
              if actual_digest != digest:
                  raise SystemExit(f"Frozen archive bytes failed SHA-256: {artifact_id}")
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  for filename in filenames:
                      matches = [item for item in bundle.namelist()
                                 if Path(item).name == filename]
                      if len(matches) != 1:
                          raise SystemExit(f"Frozen artifact lacks unique {filename}")
                      (root / filename).write_bytes(bundle.read(matches[0]))
              provenance.append({"run_id": run_id, "artifact_id": artifact_id,
                                 "artifact_digest": digest, "artifact_name": name})
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          report = {"frozen_inputs": provenance, "commit_sha": os.environ["GITHUB_SHA"],
                    "run_id": os.environ["GITHUB_RUN_ID"],
                    "owner_command_comment_id": event["comment"]["id"]}
          (root / "run-provenance.json").write_text(json.dumps(report, indent=2) + "\n")
          PY

      - name: Replay frozen projection before opening production transaction
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from fdre.research.historical_universe_identity_adjudication_manifest import (
              build_hu5_identity_adjudication_cases,
          )
          from fdre.research.historical_universe_identity_adjudication_apply import (
              validate_identity_adjudication_projection,
          )

          root = Path(os.environ["OUTPUT_DIR"])
          cases = build_hu5_identity_adjudication_cases(
              topology=json.loads((root / "topology.json").read_text()),
              residual_sec=json.loads((root / "sec-evidence.json").read_text()),
          )
          validate_identity_adjudication_projection(
              json.loads((root / "projection.json").read_text()),
              expected_plan_id=os.environ["EXPECTED_PLAN_ID"], cases=cases,
          )
          PY

      - name: Apply exact reviewed identities after in-transaction closure checks
        env:
          FDRE_ALLOW_PROD: "1"
        run: |
          set -euo pipefail
          python -m scripts.research.historical_universe.historical_universe_identity_adjudication_apply \
            --database-url "${DATABASE_URL}" \
            --residual-sec "${OUTPUT_DIR}/sec-evidence.json" \
            --projection "${OUTPUT_DIR}/projection.json" \
            --expected-manifest-id "${EXPECTED_MANIFEST_ID}" \
            --expected-plan-id "${EXPECTED_PLAN_ID}" \
            --expected-audit-id "${EXPECTED_AUDIT_ID}" \
            --expected-topology-id "${EXPECTED_TOPOLOGY_ID}" \
            --apply \
            --output "${OUTPUT_DIR}/apply.json"

      - name: Independently audit committed identity-strict coverage
        run: |
          set -euo pipefail
          python -m scripts.research.historical_universe.historical_universe_identity_strict_coverage \
            --database-url "${DATABASE_URL}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --output "${OUTPUT_DIR}/identity-strict-coverage.json"
          python -m scripts.research.historical_universe.historical_universe_identity_closure_audit \
            --database-url "${DATABASE_URL}" \
            --apply-report "${OUTPUT_DIR}/apply.json" \
            --output "${OUTPUT_DIR}/closure-audit.json"

      - name: Require independent 6088 of 6088 identity closure
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          audit = json.loads((root / "identity-strict-coverage.json").read_text())
          closure = json.loads((root / "closure-audit.json").read_text())
          expected = {"day_count": 6088, "strict_eligible_day_count": 6088,
                      "blocked_day_count": 0, "provisional_membership_count": 0,
                      "relevant_provisional_identity_count": 0}
          if {key: audit.get(key) for key in expected} != expected:
              raise SystemExit("Independent identity-strict audit failed closure")
          if audit["audit_id"] != closure["identity_strict_coverage"]["audit_id"]:
              raise SystemExit("Independent committed-state audits disagree")
          PY

      - name: Preserve apply and independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu5-final-identity-apply-${{ github.run_id }}
          path: data/processed/historical-universe/final-identity-apply
          if-no-files-found: warn
          retention-days: 90
