name: Temporary align holdout with src layout

on:
  push:
    branches:
      - phase0-part7-4-sealed-v2-holdout

permissions:
  contents: write

jobs:
  align:
    if: ${{ !contains(github.event.head_commit.message, 'completed src layout dependency') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase0-part7-4-sealed-v2-holdout
          fetch-depth: 0
      - name: Merge layout branch and resolve moved holdout test
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin repo-layout-src-fdre:refs/remotes/origin/repo-layout-src-fdre

          set +e
          git merge --no-edit origin/repo-layout-src-fdre
          merge_status=$?
          set -e
          if [ "${merge_status}" -ne 0 ]; then
            git status --short
            if [ -f tests/fdre/test_cross_sectional_v2_holdout.py ]; then
              git add tests/fdre/test_cross_sectional_v2_holdout.py
            elif [ -f packages/fdre/tests/test_cross_sectional_v2_holdout.py ]; then
              mkdir -p tests/fdre
              mv packages/fdre/tests/test_cross_sectional_v2_holdout.py tests/fdre/test_cross_sectional_v2_holdout.py
              git add -A packages/fdre/tests tests/fdre
            fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo 'Unexpected unresolved merge paths:' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi

          python - <<'PY'
          from pathlib import Path
          path = Path('tests/fdre/test_cross_sectional_v2_holdout.py')
          path.write_text(
              path.read_text().replace(
                  'Path(__file__).resolve().parents[3]',
                  'Path(__file__).resolve().parents[2]',
              )
          )
          PY

          rm .github/workflows/tmp-align-holdout-with-src-layout.yml
          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'chore: completed src layout dependency'
          else
            git commit --allow-empty -m 'chore: completed src layout dependency'
          fi
          git push origin HEAD:phase0-part7-4-sealed-v2-holdout
