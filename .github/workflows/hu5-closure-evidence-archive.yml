name: Archive HU-5 closure evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hu5-closure-evidence-archive.yml"

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: fdre-hu5-closure-evidence-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Preserve pinned HU-5 closure archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_ARTIFACT_ID: "9971101844"
      SOURCE_RUN_ID: "33971576262"
      SOURCE_COMMIT: "3e4f2df5a7d57c6d3cbd6da1ccb317f6cba9451a"
      EXPECTED_SHA256: "ac326c69c936a859a6af0155653d0c55e3ca4464b5cf130004f77223e0dbf0cc"
      ASSET_NAME: "hu5-final-identity-apply-33971576262.zip"
      PACKAGE_NAME: "fdre-hu5-closure-evidence"
      PACKAGE_TAG: "sha256-ac326c69c936a859a6af0155653d0c55e3ca4464b5cf130004f77223e0dbf0cc"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate pinned archive contract
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "kenchengkc/the-financial-document-retrieval-engine"
          test "${SOURCE_ARTIFACT_ID}" = "9971101844"
          test "${SOURCE_RUN_ID}" = "33971576262"
          test "${SOURCE_COMMIT}" = "3e4f2df5a7d57c6d3cbd6da1ccb317f6cba9451a"
          test "${EXPECTED_SHA256}" = "ac326c69c936a859a6af0155653d0c55e3ca4464b5cf130004f77223e0dbf0cc"
          test "${PACKAGE_TAG}" = "sha256-${EXPECTED_SHA256}"

      - name: Download exact GitHub Actions artifact
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output "${ASSET_NAME}"

      - name: Verify archive digest and payload
        run: |
          set -euo pipefail
          printf '%s  %s\n' "${EXPECTED_SHA256}" "${ASSET_NAME}" | sha256sum --check --strict -
          python - <<'PY'
          import os
          from zipfile import ZipFile

          expected = {
              "apply.json",
              "closure-audit.json",
              "identity-strict-coverage.json",
              "projection.json",
              "run-provenance.json",
              "sec-evidence.json",
              "topology.json",
          }
          with ZipFile(os.environ["ASSET_NAME"]) as archive:
              actual = {item.filename for item in archive.infolist() if not item.is_dir()}
          if actual != expected:
              missing = sorted(expected - actual)
              unexpected = sorted(actual - expected)
              raise SystemExit(
                  f"HU-5 closure archive payload changed: missing={missing}, unexpected={unexpected}"
              )
          PY
          printf '%s  %s\n' "${EXPECTED_SHA256}" "${ASSET_NAME}" > "${ASSET_NAME}.sha256"

      - name: Log in to GitHub Container Registry
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Prepare content-addressed evidence image
        id: package
        run: |
          set -euo pipefail
          package="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${PACKAGE_NAME}"
          image_ref="${package}:${PACKAGE_TAG}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

          if docker manifest inspect "${image_ref}" >/dev/null 2>&1; then
            echo "existing=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir -p evidence
          cp "${ASSET_NAME}" "${ASSET_NAME}.sha256" evidence/
          cat > Dockerfile.evidence <<EOF
          FROM scratch
          LABEL org.opencontainers.image.title="FDRE HU-5 final identity closure evidence"
          LABEL org.opencontainers.image.description="Frozen generated evidence archive for the HU-5 final identity closure"
          LABEL org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}"
          LABEL org.opencontainers.image.revision="${SOURCE_COMMIT}"
          LABEL io.fdre.source-actions-run="${SOURCE_RUN_ID}"
          LABEL io.fdre.source-artifact-id="${SOURCE_ARTIFACT_ID}"
          LABEL io.fdre.archive-sha256="${EXPECTED_SHA256}"
          COPY evidence/ /evidence/
          CMD ["/evidence/${ASSET_NAME}"]
          EOF
          docker build --file Dockerfile.evidence --tag "${image_ref}" .
          echo "existing=false" >> "${GITHUB_OUTPUT}"

      - name: Publish content-addressed evidence package
        if: steps.package.outputs.existing == 'false'
        run: |
          set -euo pipefail
          docker push "${{ steps.package.outputs.image_ref }}"

      - name: Pull back and verify preserved archive
        run: |
          set -euo pipefail
          image_ref="${{ steps.package.outputs.image_ref }}"
          docker pull "${image_ref}"
          container_id="$(docker create "${image_ref}")"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          mkdir -p published
          docker cp "${container_id}:/evidence/${ASSET_NAME}" "published/${ASSET_NAME}"
          docker cp "${container_id}:/evidence/${ASSET_NAME}.sha256" "published/${ASSET_NAME}.sha256"
          (
            cd published
            sha256sum --check --strict "${ASSET_NAME}.sha256"
          )
          actual_checksum="$(sha256sum "published/${ASSET_NAME}" | cut -d' ' -f1)"
          test "${actual_checksum}" = "${EXPECTED_SHA256}"
          image_id="$(docker image inspect "${image_ref}" --format '{{.Id}}')"
          {
            echo "### HU-5 closure evidence preserved"
            echo
            echo "- Package: \`${image_ref}\`"
            echo "- Package image ID: \`${image_id}\`"
            echo "- Source artifact: \`${SOURCE_ARTIFACT_ID}\` from run \`${SOURCE_RUN_ID}\`"
            echo "- Archive SHA-256: \`${EXPECTED_SHA256}\`"
            echo "- Payload files: 7 / 7 exact"
          } >> "${GITHUB_STEP_SUMMARY}"
