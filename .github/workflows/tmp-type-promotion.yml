name: Temporary promotion typing
on:
  push:
    branches: [research-oos-final-promotion]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research-oos-final-promotion
      - name: Apply concrete artifact types
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/fdre/research/oos_promotion.py')
          s=p.read_text()
          s=s.replace('from fdre.research.oos_diagnostics import OOSDiagnosticsReport\n', 'from fdre.research.oos_diagnostics import OOSDiagnosticsReport, OOSWindowDiagnostic\n')
          s=s.replace('from fdre.research.oos_implementation import OOSImplementationReport\n', 'from fdre.research.oos_implementation import (\n    OOSImplementationRebalance,\n    OOSImplementationReport,\n    OOSImplementationWindowResult,\n)\n')
          s=s.replace('from fdre.research.oos_selection import OOSSelectionSuiteReport\n', 'from fdre.research.oos_selection import OOSHypothesisDecision, OOSSelectionSuiteReport\n')
          s=s.replace('    diagnostics_by_window: dict[str, object],\n    statistical: object,\n    implementation: object,\n', '    diagnostics_by_window: dict[str, OOSWindowDiagnostic],\n    statistical: OOSHypothesisDecision,\n    implementation: OOSImplementationWindowResult,\n')
          s=s.replace('def _signal_decay(diagnostics_by_window: dict[str, object]) -> list[OOSSignalDecayPoint]:', 'def _signal_decay(\n    diagnostics_by_window: dict[str, OOSWindowDiagnostic],\n) -> list[OOSSignalDecayPoint]:')
          s=s.replace('                ic_mean=getattr(result, "ic_mean", None),\n', '                ic_mean=result.ic_mean,\n')
          s=s.replace('def _max_single_name_weight(rebalances: list[object]) -> float | None:', 'def _max_single_name_weight(\n    rebalances: list[OOSImplementationRebalance],\n) -> float | None:')
          s=s.replace('    statistical: object,\n    config: OOSPromotionConfig,\n', '    statistical: OOSHypothesisDecision,\n    config: OOSPromotionConfig,\n', 1)
          p.write_text(s)
          PY
      - name: Commit patch without helper workflow
        run: |
          git rm .github/workflows/tmp-type-promotion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fdre/research/oos_promotion.py
          git commit -m 'refactor: type final promotion artifacts'
          git push origin HEAD:research-oos-final-promotion
