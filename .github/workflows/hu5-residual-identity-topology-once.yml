name: One-shot HU-5 residual identity topology

on:
  push:
    branches:
      - ops/manual-hu5-residual-identity-topology-only

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
      OUTPUT_DIR: data/processed/historical-universe/residual-identity-topology
      EXPECTED_AUDIT_ID: b5dc9108a2cfbbb9d4717aa1cb52dc751e31734bb5188ec5d8e05499db64245a

    steps:
      - name: Check required database secret
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL_POOLED}" ]; then
            echo "::error::DATABASE_URL or DATABASE_URL_DIRECT is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Select database URL
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL_DIRECT}" ]; then
            echo "DATABASE_URL=${DATABASE_URL_DIRECT}" >> "${GITHUB_ENV}"
          else
            echo "DATABASE_URL=${DATABASE_URL_POOLED}" >> "${GITHUB_ENV}"
          fi

      - name: Project frozen residual identity topology
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          python -m scripts.research.historical_universe.historical_universe_identity_topology \
            --database-url "${DATABASE_URL}" \
            --universe-code sp500 \
            --window-start 2010-01-01 \
            --window-end 2026-09-01 \
            --expected-audit-id "${EXPECTED_AUDIT_ID}" \
            --output "${OUTPUT_DIR}/topology.json"

      - name: Verify frozen blocker inventory
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["OUTPUT_DIR"]) / "topology.json").read_text())
          expected = {
              "audit_id": os.environ["EXPECTED_AUDIT_ID"],
              "target_count": 39,
              "gap_count": 4,
              "blocked_day_count": 4662,
              "strict_eligible_day_count": 1426,
          }
          actual = {key: report[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"residual topology drift: expected {expected}, got {actual}")
          if len(report["topology_id"]) != 64:
              raise SystemExit("topology ID is not a SHA-256 digest")
          PY

      - name: Upload residual topology
        uses: actions/upload-artifact@v4
        with:
          name: hu5-residual-identity-topology-${{ github.run_id }}
          path: data/processed/historical-universe/residual-identity-topology/topology.json
          if-no-files-found: error
          retention-days: 30
