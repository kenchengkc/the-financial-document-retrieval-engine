# Railway service config for the FDRE API.
# Build from the repo-root Dockerfile; admit traffic only after database readiness succeeds.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "alembic upgrade head"
startCommand = "sh -c 'uvicorn apps.api.app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/ready"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
